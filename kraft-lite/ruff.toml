# This directory is published as a standalone repo, so this config must stand on
# its own there: no `extend` to a monorepo pyproject.toml that the split leaves
# behind. Values mirror the root config deliberately.
line-length = 100

# The monorepo requires Python >=3.14, but the published plugin must run on
# whatever python3 its host repo has, and .github/workflows/test.yml pins that
# floor at 3.10. Without this, `ruff format` rewrites kl.py into 3.14-only
# syntax (PEP 758 `except A, B:`) that the floor refuses to parse.
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
