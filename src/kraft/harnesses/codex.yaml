# Verified against codex-cli 0.144.6 on 2026-09-17. `-c developer_instructions=`
# is a real config field (probed with --strict-config, which rejects unknown
# keys without calling a model), which is what settled Kraft-n70's blocking
# research question.
#
# Kraft-c1qfa: `model_reasoning_effort` isn't validated by codex-cli itself --
# it's passed straight through to the model API. Probed against codex-cli
# 0.155.0 on 2026-09-22 with an invalid value: the API's own
# invalid_enum_value error names the real vocabulary as 'none', 'minimal',
# 'low', 'medium', 'high', 'xhigh', 'max'. Widening only to add xhigh, the
# value this bead named -- 'none' and 'max' are a separate widening the brief
# didn't ask for.
#
# Kraft-w3kot: `--json` output read by usage.READERS["codex-json"], verified
# against codex-cli 0.155.0 on 2026-09-23 with real runs: `thread.started`
# carries the thread id `exec resume` takes, `turn.completed.usage` the
# thread's running token total (no cost), `turn.failed.error.message` the
# reason a turn failed.
id: codex
kind: cli
command: [codex, exec]
# `codex exec resume <SESSION_ID> [PROMPT]` -- the id must precede the prompt,
# which a trailing-flag model cannot express, so resume gets its own prefix.
command_resume: [codex, exec, resume, "{value}"]

capabilities:
  context:         { channel: system_prompt, cli: ["-c", "developer_instructions={value}"] }
  structured_log:  { cli: ["--json"] }
  model:           { cli: ["-m", "{value}"], values: ['(gpt|o[0-9]|codex).*'] }
  effort:          { cli: ["-c", "model_reasoning_effort={value}"], values: [minimal, low, medium, high, xhigh] }
  # Kraft-rs9pk: every option below is a `-c` config key, because `codex exec
  # resume` rejects `-s`, `--add-dir` and `--approve-for-me` after `resume`
  # and accepts `-c`. Keys probed against codex-cli 0.155.0 on 2026-09-23 with
  # --strict-config, and their effect read off a real run's turn_context.
  #
  # `--approve-for-me` is these three keys: `sandbox_mode=workspace-write`,
  # `approval_policy=on-request`, `approvals_reviewer=auto_review`. The mode
  # stays the sandbox; the automatic reviewer rides along with every mode.
  permission_mode: { cli: ["-c", "sandbox_mode={value}", "-c", "approval_policy=on-request", "-c", "approvals_reviewer=auto_review"], values: [read-only, workspace-write, danger-full-access], always: workspace-write }
  # workspace-write writes the worktree and /tmp only, and $KRAFT_RESULT_PATH
  # lives under $KRAFT_HOME/run/results: without this a write under $HOME is
  # refused. A TOML literal string, so a backslash in the path is harmless.
  result_dir:      { cli: ["-c", "sandbox_workspace_write.writable_roots=['{value}']"] }
  resume:          { via: command_resume }
  usage:             { source: envelope, reader: codex-json }
  rate_limit_signal: { reader: codex-json }
  # Bare positional -> declared last, or a preceding flag swallows it.
  prompt:          { cli: ["{value}"] }

# Absent, deliberately: deny_tools, allowed_tools, approval_channel,
# autocompact. A binding naming one of those is rejected
# at load, naming this file.
