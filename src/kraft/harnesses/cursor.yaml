# Cursor's agent CLI (Kraft-bosip). Every flag below checked against
# `agent --help` of cursor-agent 2026.09.18-9a7762b on 2026-09-23, installed
# with the official `curl https://cursor.com/install | bash`.
#
# NOT verified by a real run: nobody here has a Cursor account. Run with no
# credentials, `agent -p --force --trust --output-format stream-json ...`
# exits 1 with "Error: Authentication required. Please run 'agent login'
# first, or set CURSOR_API_KEY environment variable." on stderr and nothing on
# stdout -- after the argv parsed (an unknown flag fails earlier, with
# "unknown option"), so the command line is known good and nothing past it is.
#
# The stream-json log is read by usage.READERS["cursor-stream-json"], built
# from cursor.com/docs/cli/reference/output-format, not from a captured run.
# The format carries no tokens, no cost and no rate-limit event, so a cursor
# session records none of the three: NULL, never a guessed or zero number.
#
# Login state lives under $HOME, which a worker gets. An API-key install needs
# `env_passthrough: [CURSOR_API_KEY]` in the repo's repos.yaml entry: the
# worker environment is an allowlist and does not carry it.
id: cursor
kind: cli
# `-p` is print mode, a boolean -- the prompt is a positional. `--trust` skips
# the workspace-trust prompt "(headless mode only)" per the parameters docs,
# and every Kraft worktree is a workspace Cursor has never seen. Whether a
# headless run without it would stop is unverified (needs an account).
command: [agent, -p, --trust]

capabilities:
  # No system-prompt or rules flag exists; Cursor reads AGENTS.md and
  # .cursor/rules from the workspace, which Kraft does not write. So context
  # rides in the prompt, like gemini.
  context:         { channel: prompt }
  structured_log:  { cli: ["--output-format", "stream-json"] }
  # No `values:` on purpose, as in claude.yaml: Cursor's model list changes
  # without Kraft (`agent models` lists this account's), and `values:` is a
  # hard gate at load. A wrong model is caught by the CLI at launch.
  model:           { cli: ["--model", "{value}"] }
  # Not a mode flag but a switch: without `--force`, print mode only proposes
  # changes and applies none ("Without --force, changes are only proposed, not
  # applied", headless docs). So it is on for every launch, and no other value
  # is accepted. The disposable worktree is the real boundary, as for gemini.
  permission_mode: { cli: ["--force"], values: [force], always: force }
  # `--resume [chatId]`. That the init line's `session_id` is the chatId this
  # takes is the docs' word ("Session IDs remain consistent") -- unverified.
  resume:          { cli: ["--resume", "{value}"] }
  usage:           { source: envelope, reader: cursor-stream-json }
  # `--` ends option parsing (checked: `agent -p -- --x` reaches the auth
  # check, `agent -p --x` is "unknown option"), so a prompt starting with a
  # dash stays a prompt. Declared last: it is the positional.
  prompt:          { cli: ["--", "{value}"] }

# Absent, deliberately. A binding naming one of these is rejected at load,
# naming this file.
# - effort: no flag. A model id can carry it, `--model 'name[effort=high]'`,
#   so a profile that needs it spells it in the model value.
# - deny_tools, allowed_tools, restrict_tools: no per-launch tool flags; the
#   permission lists live in ~/.cursor/cli-config.json. With no
#   restrict_tools or under_allowlist, a launch under an allowlist is refused.
# - approval_channel: no flag hands approvals to an MCP tool.
# - autocompact: no flag.
# - rate_limit_signal: the stream has no rate-limit event, so a limit fails
#   the launch rather than parking it or switching to a fallback.
# Unbound though they exist: --sandbox (Cursor's own command sandbox, left to
# the user's cli-config), --approve-mcps (Kraft registers no MCP server with
# Cursor), --mode plan|ask (read-only modes no Kraft task asks for).
