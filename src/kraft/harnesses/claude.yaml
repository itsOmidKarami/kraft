# How Claude Code spells the options Kraft names neutrally. A fact about a
# CLI. An operator who needs to change one drops a file of this name into
# $KRAFT_HOME/templates/harnesses/ and thereby owns it -- see harness.py.
id: claude
kind: cli
command: [claude]

capabilities:
  prompt:           { cli: ["-p", "{value}"] }
  context:          { channel: system_prompt, cli: ["--append-system-prompt", "{value}"] }
  # --verbose is mandatory, not decoration: without it the CLI exits 1 with
  # "When using --print, --output-format=stream-json requires --verbose"
  # (measured against claude 2.1.260).
  structured_log:   { cli: ["--output-format", "stream-json", "--verbose"] }
  # No `values:` on purpose -- the empty list means "accepts anything"
  # (harness.value_ok). `--model` takes "an alias for the latest model (e.g.
  # fable, opus, or sonnet) or a model's full name", plus the provider-prefixed
  # ids Bedrock and Vertex use (us.anthropic.claude-...): a set Anthropic
  # changes without Kraft, so any list shipped here goes stale. It is also a
  # hard gate rather than a warning -- a profile or task whose value fails
  # `values:` is refused at load -- so a too-narrow list stops an existing
  # install's chains resolving after an upgrade.
  # A wrong model is caught by the CLI at launch, which is the cheap failure.
  # `effort` and `permission_mode` below keep their lists: those really are
  # closed vocabularies the CLI prints back at you.
  model:            { cli: ["--model", "{value}"] }
  effort:           { cli: ["--effort", "{value}"], values: [low, medium, high, xhigh, max] }
  # Kraft-avpe: Monitor is never legitimate in a one-shot `claude -p` process
  # -- there is no later turn for it to resume into -- so it is denied on
  # every launch rather than trusted to prose.
  deny_tools:       { cli: ["--disallowed-tools", "{csv}"], always: [Monitor] }
  # --allowedTools only pre-approves: it restricts nothing. Under an allowlist
  # (Kraft-nt6tt) the launch also cuts the built-in tools to the list with
  # --tools, which "doesn't affect MCP tools" (code.claude.com/docs/en/
  # cli-reference), and runs in `manual`: in `auto` "everything else goes to
  # the classifier" (docs/en/permission-modes), which approves an unlisted
  # tool without ever asking the permission gate. `manual` asks the gate
  # about every call it does not settle itself. What it settles itself
  # without asking is read-only work -- file reads (gone unless listed) and
  # read-only shell commands, so under a scoped rule such as `Bash(git *)`
  # a read-only `cat` still runs.
  allowed_tools:    { cli: ["--allowedTools", "{csv}"] }
  restrict_tools:   { cli: ["--tools", "{csv}"] }
  permission_mode:  { cli: ["--permission-mode", "{value}"], values: [acceptEdits, auto, bypassPermissions, manual, dontAsk, plan], always: auto, under_allowlist: manual }
  # The CLI calls this MCP tool instead of prompting a human. On an install
  # where `kraft admin init` never registered it, the flag names a tool that
  # does not exist and the CLI completes normally (measured).
  approval_channel: { cli: ["--permission-prompt-tool", "{value}"], always: mcp__kraft__permission_request }
  resume:           { cli: ["--resume", "{value}"] }
  autocompact:      { cli: ["--autocompact", "{value}"] }
  usage:            { source: envelope, reader: claude-stream-json }
  rate_limit_signal: { reader: claude-stream-json }
