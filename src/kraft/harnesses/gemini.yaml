# Verified against gemini 0.46.0 on 2026-09-17. This is the harness that
# stresses the format: no out-of-band context channel, no effort, and a
# --resume that takes an index or "latest" rather than a session id, so it
# declares no `resume` capability at all.
id: gemini
kind: cli
# `--skip-trust` trusts the worktree for this session: without it a headless
# gemini (0.61.0) outside a trusted folder refuses to start (Kraft-6vvf3),
# and every Kraft worktree is a fresh folder. Checked against 0.61.0's --help.
command: [gemini, --skip-trust]

capabilities:
  context:         { channel: prompt }
  structured_log:  { cli: ["-o", "stream-json"] }
  model:           { cli: ["-m", "{value}"], values: ['gemini-.*'] }
  # `yolo`, not `auto_edit`: auto_edit auto-approves edit tools only, so Bash
  # would still prompt, and a headless worker has nobody to ask -- every ask
  # becomes a silent denial (the failure work item 6363c65e already cost us).
  # The disposable worktree is the real boundary, not the approval mode.
  permission_mode: { cli: ["--approval-mode", "{value}"], values: [default, auto_edit, yolo, plan], always: yolo }
  usage:           { source: result_file }
  prompt:          { cli: ["-p", "{value}"] }

# Absent: effort, deny_tools, allowed_tools, approval_channel, resume,
# autocompact, rate_limit_signal.

# The host this CLI reaches itself, added to a `network:` launch's runtime
# allow list (spec §1). UNVERIFIED: taken from the Gemini API docs, not
# probed; an e2e("gemini") under `network:` confirms it.
network:
  requires: [generativelanguage.googleapis.com]

# How the egress proxy can hold this CLI's API key (spec §6); see claude.yaml.
# The sentinel has a real key's shape: AIza and 39 characters in all.
# Verified with gemini 0.61.0 by e2e("gemini") in test_credentials_docker.
credentials:
  - service: google
    env: GEMINI_API_KEY
    sentinel: AIzaKraftProxyManaged000000000000000000
    inject: [{domain: generativelanguage.googleapis.com, header: x-goog-api-key}]
