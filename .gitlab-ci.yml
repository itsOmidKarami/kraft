# Free-tier minutes: a pipeline per WIP push was most of the spend (3 of 6 recent
# pipelines were pushes to a working branch nobody was reviewing yet). Pipelines now
# run where a result is actually read — an MR, the default branch, or a tag.
workflow:
  # A push to an MR's source branch cancels that MR's still-running pipeline
  # instead of letting both burn runner time. Only jobs marked `interruptible`
  # get killed; release/tag jobs below are deliberately left out of that.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: never

# Declared so the release stage exists; every pre-existing job is `test`, which
# was the implicit default before this.
stages: [test, release]

default:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim

variables:
  UV_CACHE_DIR: .uv-cache
  # Chunk B's adapters shell out to real `git` and `bd`; the slim image ships neither.
  BD_VERSION: "1.2.2"

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache

# The paths that can change what `pytest` does. One list, two jobs.
.py-changes: &py-changes
  - src/**/*
  - tests/**/*
  - templates/**/*
  # pyproject's testpaths includes plugins/kraft-lite/tests, so the suite
  # covers the plugin; without this line a plugin-only merge produces no
  # job and main - the only place the merge result runs - never tests it.
  - plugins/**/*
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

# `rules: changes` has no diff to compare against on a tag pipeline, and GitLab
# reads it as *always true* there -- which re-ran lint, slow, frontend and e2e on
# the tag against the tree main had finished testing seconds earlier. A tag builds
# and publishes; it does not re-test.
.not-on-tags: &not-on-tags
  if: $CI_COMMIT_TAG
  when: never

# `git` + `bd` aren't in the slim image; both test jobs need them.
.py-before-script: &py-before-script
  - apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
  # Arch-aware so the same config runs on a self-hosted arm64 runner. GitLab's
  # shared runners are x86_64, where this resolves to amd64 exactly as before.
  - case "$(uname -m)" in aarch64|arm64) BD_ARCH=arm64 ;; *) BD_ARCH=amd64 ;; esac
  - curl -fsSL "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_${BD_ARCH}.tar.gz" | tar -xz -C /usr/local/bin bd
  - git config --global user.email ci@kraft.invalid && git config --global user.name "Kraft CI"
  - git --version && bd version

# Blocking fast feedback: lint + everything except the slow/e2e tiers.
#
# This ran unconditionally on merge requests, to keep one job that always
# produces a pipeline: a fully path-gated MR can yield zero jobs, and
# `merge_when_pipeline_succeeds` then never fires. `release-impact` is
# unconditional on every merge request now and holds that guarantee, so this job
# path-gates everywhere. If release-impact is ever gated or dropped, something
# else has to be unconditional or auto-merge breaks.
lint-and-test:
  stage: test
  interruptible: true
  rules:
    - *not-on-tags
    - changes: *py-changes
  variables:
    # setuptools-scm derives the version from tags; a shallow clone has none and
    # every build in it silently versions itself 0.1.dev1.
    GIT_DEPTH: 0
  before_script: *py-before-script
  script:
    - uv sync --frozen
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest -m "not e2e and not slow"
    # ~1s, no tests run: catches a renamed pinned test the suite above would not.
    - uv run python -m kraft.intent
  after_script:
    - uv cache prune --ci

# The path gates apply on the default branch too. A merge fires a second pipeline on
# main, and without gating it re-ran in full what the MR pipeline had just proven —
# roughly doubling the spend. The main pipeline is still worth keeping: MR pipelines
# here are detached (they test the source branch, not the merge result, and
# merged-results pipelines are a paid feature), so main is the only place the merged
# state is actually tested. Gate it, don't drop it.
#
# Blocking, but runs in parallel so it doesn't hold up the fast signal.
# Subprocess servers, real uvicorn, multi-second sleeps (see pyproject `slow` marker).
slow-tests:
  stage: test
  interruptible: true
  rules:
    - *not-on-tags
    - changes: *py-changes
  before_script: *py-before-script
  script:
    - uv sync --frozen
    - uv run pytest -m "slow"
  after_script:
    - uv cache prune --ci

# `main` on the public plugin repo is force-pushed on every publish, so its tags
# are the only fixed points in that history. A plugin change merged without a
# version bump has no tag it can be released under: `just lite-publish` refuses,
# and until somebody tries, main here holds plugin content matching no release.
# `lite-version` lived here: it failed a merge request that changed
# plugins/kraft-lite's published surface without bumping the version committed in
# its plugin.json. Both plugins now take their version from the release tag,
# written into plugin.json by `auto-tag` below, so there is no committed number
# left for anyone to forget. The `release::` label is the guard that replaced it.

# The plugin claims to need "python3 and nothing else", and its own workflow pins
# that floor at 3.10 -- but that workflow only runs on the published repo, which
# is after a bad publish has already reached users. This is the same check one
# step earlier. `--no-project` is required: this repo's pyproject demands >=3.14
# and uv refuses the older interpreter without it. No lockfile and nothing but
# pytest, so a dependency appearing here is the first sign the plugin stopped
# being stdlib-only.
#
# No before_script on purpose: the bd-backed tests skip when `bd` is absent, so
# this runs 124 passed / 3 skipped rather than paying for the bd download. The
# skipped three are covered by lint-and-test, which installs it.
lite-floor:
  stage: test
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - plugins/kraft-lite/**/*
        # Without this the job cannot run in the merge request that changes it.
        - .gitlab-ci.yml
  script:
    - uv run --python 3.10 --no-project --with pytest pytest plugins/kraft-lite/tests -q

frontend:
  stage: test
  image: node:20-bookworm-slim
  interruptible: true
  rules:
    - *not-on-tags
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules
  before_script:
    - cd frontend && npm ci
  script:
    - npm run build
    - npm test

# The browser counterpart to the gated Python e2e (`pytest -m e2e`,
# KRAFT_E2E=1) — the blocking Python job runs `-m "not e2e"`.
#
# Automatic when a change touches what the specs actually drive, manual
# otherwise. It used to be manual unconditionally, and that is how
# `chain.spec.ts` merged broken: flipping the intake default from `quick-task`
# to `default` left the one spec that never picks a template waiting for a
# chain that now stops at spec_approval. Nothing ran it.
#
# Blocking on the automatic path. The suite had never had a green run before
# this — every spec that submits the intake form died on a dialog clipped by
# the viewport — so this job earns the gate only because that is now fixed and
# it passes 22/23 (1 skipped) in ~23s. If it starts costing more than it
# catches, widen the manual fallback rather than deleting the rule.
#
# The paths are the spec's real blast radius, not "anything Python": the SPA it
# clicks, the specs and their server harness, the HTTP API they drive, and the
# chain templates they run. Listing all of src/kraft here would fire on nearly
# every MR, which is the same as having no manual fallback at all.
#
# The image tag and frontend/package.json's exact "@playwright/test" pin must
# move together: the image ships only the browsers its own version expects.
frontend-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  interruptible: true
  rules:
    - *not-on-tags
    - changes:
        - frontend/src/**/*
        - frontend/e2e/**/*
        - frontend/package.json
        - src/kraft/api.py
        - templates/**/*
        - .gitlab-ci.yml
      when: on_success
      allow_failure: false
    # Everything else: still there to click, still cannot fail the pipeline.
    - when: manual
      allow_failure: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl python3
    # Arch-aware so the same config runs on a self-hosted arm64 runner. GitLab's
    # shared runners are x86_64, where this resolves to amd64 exactly as before.
    - case "$(uname -m)" in aarch64|arm64) BD_ARCH=arm64 ;; *) BD_ARCH=amd64 ;; esac
    - curl -fsSL "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_${BD_ARCH}.tar.gz" | tar -xz -C /usr/local/bin bd
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - git config --global user.email ci@kraft.invalid && git config --global user.name "Kraft CI"
    - uv sync --frozen
    - cd frontend && npm ci && npx playwright install chromium && cd ..
  script:
    - cd frontend && npm run build && cd ..
    - export PATH="$HOME/.local/bin:$PATH"
    - uv run python frontend/e2e/serve.py > e2e-server.log 2>&1 &
    - for i in $(seq 1 60); do grep -q KRAFT_E2E_REPO e2e-server.log && break; sleep 1; done
    - export KRAFT_E2E_REPO=$(sed -n 's/.*KRAFT_E2E_REPO=//p' e2e-server.log)
    - test -n "$KRAFT_E2E_REPO" || { cat e2e-server.log; exit 1; }
    - cd frontend && npm run e2e
  after_script:
    - cat e2e-server.log || true


# A tag is the only thing that publishes. The workflow rules at the top already
# admit tag pipelines, so this job's rule is the whole gate.
#
# Split from the `release` job below on purpose. GitLab implements the `release:`
# keyword by running glab or release-cli *inside the job's own image*, and this
# one is a node image so it has neither -- the first attempt died on `exit 127`
# after building and uploading a perfectly good wheel. Handing the values over as
# a dotenv report is also the documented way to do this, rather than the
# same-job shortcut it replaced.
release-build:
  stage: release
  # The same node the `frontend` job builds on. bookworm's `apt-get install
  # nodejs` is still Node 18, and a release must not be the one build that runs
  # the SPA through a different toolchain than every check that passed it.
  image: node:20-bookworm-slim
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    # setuptools-scm reads the version from tags. Without this the wheel would be
    # versioned 0.1.dev1 no matter what tag triggered the pipeline.
    GIT_DEPTH: 0
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    # `uv tool install`, not a release tarball: just's assets carry the version in
    # their filename (just-1.58.0-x86_64-...), so /latest/download/ 404s on every
    # architecture, and the runner is arm64 besides. uv is already here and
    # resolves both without a URL to rot.
    - uv tool install rust-just
  script:
    - export PATH="$HOME/.local/bin:$PATH"
    - cd frontend && npm ci && cd ..
    - just bundle
    - uv build --wheel
    - WHEEL=$(ls dist/*.whl)
    # Smoke test: a wheel that lost the SPA, or that versioned itself from a
    # shallow clone, must not become a release. This is the guard that makes
    # `just bundle` living outside the build backend survivable.
    - uv venv /tmp/smoke
    - VIRTUAL_ENV=/tmp/smoke uv pip install "$WHEEL"
    - /tmp/smoke/bin/kraft --version | grep -qF "${CI_COMMIT_TAG#v}"
    # Ask the installed package where its bundle is, rather than guessing a
    # site-packages path that a python version bump would silently invalidate.
    - >
      /tmp/smoke/bin/python -c
      "from kraft.paths import BUNDLED; import sys;
      sys.exit(0 if (BUNDLED / 'web' / 'index.html').is_file() else 1)"
    - |
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$WHEEL" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/kraft/${CI_COMMIT_TAG#v}/$(basename "$WHEEL")"
    - echo "WHEEL_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/kraft/${CI_COMMIT_TAG#v}/$(basename "$WHEEL")" >> release.env
    - echo "WHEEL_NAME=$(basename "$WHEEL")" >> release.env
  artifacts:
    paths: [dist/*.whl]
    reports:
      dotenv: release.env

# Every merge request declares what it ships. The version comes from the git tag
# now, so there is no bump commit left to forget -- which means the only place
# anyone can be asked is here, while the author still knows what the change is
# worth. `release::none` is a first-class answer and the expected one for docs,
# comments, CI config and test-only changes.
#
# Needs the four scoped labels to exist in the project first; see CONTRIBUTING.md.
release-impact:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - >
      python3 dev/next_tag.py "" "$CI_MERGE_REQUEST_LABELS" > /dev/null ||
      { echo "This MR needs one of: release::major, release::minor, release::patch, release::none"; exit 1; }
    # Quoted: an unquoted `: ` would make YAML read this line as a mapping, and
    # GitLab then rejects the whole config with an empty, failed pipeline.
    - 'echo "declared: $CI_MERGE_REQUEST_LABELS"'

# The merge landed. Read the label off the merge request that produced this
# commit and tag, which fires the `release` job above via a fresh tag pipeline.
#
# This job must never run on a tag pipeline, or the tag it pushes triggers it
# again forever. The workflow rules at the top separate $CI_COMMIT_TAG from
# $CI_COMMIT_BRANCH and the rule below is branch-only, so that holds -- but it is
# the failure worth naming rather than trusting.
#
# RELEASE_TOKEN is a project access token with the api scope and permission to
# push protected tags; CI_JOB_TOKEN cannot. See CONTRIBUTING.md.
auto-tag:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # `git describe` needs the tags, and a shallow clone has none -- every
    # release would compute as the first one.
    GIT_DEPTH: 0
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git curl jq ca-certificates
  script:
    - |
      LABELS=$(curl -fsSL --header "PRIVATE-TOKEN: $RELEASE_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/commits/$CI_COMMIT_SHA/merge_requests" \
        | jq -r '.[0].labels // [] | join(",")')
    # A commit that reached main without a merge request -- a direct push, the
    # revert button, a cherry-pick -- has no labels to read. That is `none`, and
    # saying so is what stops it looking like a broken job.
    - if [ -z "$LABELS" ]; then echo "no merge request for $CI_COMMIT_SHA; not releasing"; exit 0; fi
    - PREVIOUS=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
    # No `|| true`: next_tag exits 0 with no output for release::none, and
    # non-zero only when it cannot read the previous tag. Swallowing that would
    # turn a broken tag history into a silently skipped release.
    - TAG=$(python3 dev/next_tag.py "$PREVIOUS" "$LABELS")
    - if [ -z "$TAG" ]; then echo "release::none; not releasing"; exit 0; fi
    - git remote set-url origin "https://oauth2:${RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    # Both plugins are published by `git subtree split`, which publishes what is
    # committed -- so the number has to be in the files before the tag exists,
    # not stamped onto a copy afterwards. That is what buys the published repo a
    # real history instead of one regenerated commit.
    #
    # This commit arrives on main with no merge request behind it, which the
    # no-labels branch above reads as `none`, so it cannot trigger a second
    # release. Do not remove that guard without replacing it.
    - python3 dev/stamp_plugin_versions.py "${TAG#v}"
    - git add plugins/kraft/.claude-plugin/plugin.json plugins/kraft-lite/.claude-plugin/plugin.json
    - 'git -c user.email=ci@kraft.invalid -c user.name="Kraft CI" commit -qm "chore: plugins $TAG"'
    # `-o ci.skip`: this commit only rewrites two version strings, but it touches
    # plugins/**, so an ordinary push re-ran the whole Python suite on main against
    # a tree it had just tested. The tag push below is a separate push and still
    # gets its pipeline, which is the one that publishes.
    - git push -o ci.skip origin "HEAD:$CI_COMMIT_BRANCH"
    - 'git -c user.email=ci@kraft.invalid -c user.name="Kraft CI" tag -a "$TAG" -m "$TAG"'
    - git push origin "$TAG"
    - echo "tagged $TAG"

# Creates the Release object and nothing else. Its image is the only one in this
# file chosen for a tool rather than a language: release-cli is what the
# `release:` keyword shells out to. $WHEEL_URL and $WHEEL_NAME arrive from
# release-build's dotenv report, which is why `needs:` is not optional here.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["release-build"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - 'echo "creating the release for $CI_COMMIT_TAG"'
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Kraft $CI_COMMIT_TAG"
    assets:
      links:
        # The name must end in .whl: update._parse picks the wheel out of a
        # release by that suffix, and a link named otherwise makes every release
        # look uninstallable.
        - name: "$WHEEL_NAME"
          url: "$WHEEL_URL"
