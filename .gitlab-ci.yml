# Free-tier minutes: a pipeline per WIP push was most of the spend (3 of 6 recent
# pipelines were pushes to a working branch nobody was reviewing yet). Pipelines now
# run where a result is actually read — an MR, the default branch, or a tag.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: never

default:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim

variables:
  UV_CACHE_DIR: .uv-cache
  # Chunk B's adapters shell out to real `git` and `bd`; the slim image ships neither.
  BD_VERSION: "1.2.2"

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache

# `git` + `bd` aren't in the slim image; both test jobs need them.
.py-before-script: &py-before-script
  - apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
  - curl -fsSL "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin bd
  - git config --global user.email ci@kraft.invalid && git config --global user.name "Kraft CI"
  - git --version && bd version

# Blocking fast feedback: lint + everything except the slow/e2e tiers.
# Deliberately ungated: it is the cheapest job, and keeping one job unconditional
# means every MR has a pipeline for `merge_when_pipeline_succeeds` to wait on. A
# fully path-gated pipeline can produce zero jobs, and auto-merge then never fires.
lint-and-test:
  before_script: *py-before-script
  script:
    - uv sync --frozen
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest -m "not e2e and not slow"
  after_script:
    - uv cache prune --ci

# Blocking, but runs in parallel so it doesn't hold up the fast signal.
# Subprocess servers, real uvicorn, multi-second sleeps (see pyproject `slow` marker).
slow-tests:
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - src/**/*
        - tests/**/*
        - templates/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
  before_script: *py-before-script
  script:
    - uv sync --frozen
    - uv run pytest -m "slow"
  after_script:
    - uv cache prune --ci

frontend:
  image: node:20-bookworm-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules
  before_script:
    - cd frontend && npm ci
  script:
    - npm run build
    - npm test

# Manual / non-blocking, the browser counterpart to the gated Python e2e
# (`pytest -m e2e`, KRAFT_E2E=1) — the blocking job runs `-m "not e2e"`.
# Needs a live orchestrator + a browser, so it stays out of the blocking gate.
# The image tag and frontend/package.json's exact "@playwright/test" pin must
# move together: the image ships only the browsers its own version expects.
frontend-e2e:
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  when: manual
  allow_failure: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl python3
    - curl -fsSL "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin bd
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - git config --global user.email ci@kraft.invalid && git config --global user.name "Kraft CI"
    - uv sync --frozen
    - cd frontend && npm ci && npx playwright install chromium && cd ..
  script:
    - cd frontend && npm run build && cd ..
    - export PATH="$HOME/.local/bin:$PATH"
    - uv run python frontend/e2e/serve.py > e2e-server.log 2>&1 &
    - for i in $(seq 1 60); do grep -q KRAFT_E2E_REPO e2e-server.log && break; sleep 1; done
    - export KRAFT_E2E_REPO=$(sed -n 's/.*KRAFT_E2E_REPO=//p' e2e-server.log)
    - test -n "$KRAFT_E2E_REPO" || { cat e2e-server.log; exit 1; }
    - cd frontend && npm run e2e
  after_script:
    - cat e2e-server.log || true
