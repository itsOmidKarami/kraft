# Kraft's policy: fix-loop caps, spend caps and the other operating limits
# every work item runs under. Every number here is a starting point; tune it
# against your own runs. `kraft admin reload` rereads this file without a
# restart.
#
# Fix loops. A fix loop reruns a node until it passes; `default:` bounds every
# one of them: `attempts` is how many tries it gets, `wall_clock_s` how long
# all of them may take together. A loop's own `max_attempts` in its chain wins
# over `attempts` here, so the shipped chains' fix loops take their attempts
# from the chain (`verification.fix_loop` 2, `merge_request_feedback.fix_loop`
# 3) and only their wall clock from `default:`.
#
# To change one loop's limits, name it under `loops:` by its node's path, for
# example:
#
#   loops:
#     verification.fix_loop: { attempts: 3, wall_clock_s: 7200 }
#
# Check the spelling: a key under `loops:` that names no loop in any chain is
# ignored without a warning. `merge_request_feedback.on_base_changed` counts
# the restarts a rebase triggers while a merge request is open; `default:`
# bounds it too.
#
# Waiting on something outside Kraft (a pipeline, an automated review, an
# approval, a merge landing) is not a loop and has no key here. Each wait's
# timeout is its task's own `policy: total_time_cap_minutes` in library.yaml.
loops: {}
default:             { attempts: 3, wall_clock_s: 3600 }

# Which finding severities burn a fix cycle. Minor findings are recorded and
# shown at the human_review gate instead — a roll-up nobody reads is a silent
# discard, so they are rendered there, not merely stored.
findings:
  loop_severities: [critical, important]

# How many work items may be active at once across every repo, however they
# were started: a person's Start and auto-intake each take a slot. A schedule
# files its item paused, so it takes none until a person starts it.
max_concurrent: 3

# Spend caps, in dollars. This file turns both on; delete a key to turn that
# cap off (a missing key is no cap). A cap refuses to START the next agent
# task; it cannot interrupt one that is already running, because the agent
# CLI only reports its cost when the session exits. Overshoot is bounded by the
# cost of one task, not by the cap.
budget:
  work_item_usd: 10     # per work item, across every loop in its chain
  daily_usd: 50         # every work item on this instance, since local midnight

# How many times Kraft may auto-relaunch a work item after a rejected API rate
# limit before it gives up and stops for a human. Not a fix-loop cap: a rate
# limit wait can run for hours, this only counts attempts.
rate_limit_retries: 5

# Seconds one forge CLI call (gh/glab/git) may run before it is killed and
# reported as a forge error. Bounds a single call, not a wait (that is the
# task's own total_time_cap_minutes). Raise it on a slow forge. Read at startup.
forge_cli_timeout_s: 120

# How often the MR-closed poller asks the forge about every item parked at a
# merge-request node, in seconds (minimum 30). Raise it on a rate-limited
# forge or a large board; this always runs, so there is no "off".
# forge_poll_s: 300

# Completed and abandoned items older than this many days move to the
# archive. Delete the key to keep them on the board. The board's Done header
# shows this number, and says nothing about archiving without it.
archive:
  after_days: 30

# How much disk the worktrees may use. Off until you set `limit`. Over `limit`
# Kraft holds any start that would create a new worktree until you make room:
# archive finished items (Settings > Storage shows what each one frees), finish
# or abandon live work, or raise the limit. Work that already has a worktree
# keeps running. Kraft deletes nothing for the limit on its own unless you add
# `auto_cleanup`. Over `quota` it only warns; `quota` defaults to 80% of
# `limit`. A size is a whole number with a unit: 1000M, 10G, 1T.
#
# To have Kraft make that room itself, add `auto_cleanup`. Over `limit` it then
# archives completed and abandoned items, oldest first, until usage is back
# under `quota`. It never takes an item that ended less than `min_age` ago
# (hours or days: 12h, 24h, 2d). Archiving removes the worktree and any
# uncommitted changes in it; a branch with unpushed commits is kept.
# storage:
#   worktrees:
#     limit: 10G
#     quota: 8G
#     auto_cleanup:
#       min_age: 24h

# Schedules (a work item filed from a cron) are `intake.yaml`'s `schedules:`,
# with the rest of what files work by itself. A `triggers:` list here is
# still read; `kraft admin doctor` names the move.

# ── Operational defaults and administrator maxima ─────────────────────────────
#
# `defaults:` are inheritable starting points with no safety meaning of their
# own; a repository, work item, chain or execution node may move them in
# either direction. `maxima:` bounds those overrides — a safety field listed
# only here (`allowed_tools`) starts *at* its maximum and can only ever be
# narrowed. Read by the same loader as everything above.
#
# The four caps -- time_cap_minutes, total_time_cap_minutes, token_budget,
# budget_usd -- are set per level of scope in both sections:
# `work_item:`, `nodes:` (a gate is a node), `steps:`, `tasks:`. A level's
# default applies to every scope of that kind unless the chain, a node, step
# or task, or the item's own override sets a value (which then also holds for
# every scope under it that sets none). A default is not a ceiling: a scope
# may set more, up to its level's maximum. A level's maximum bounds every
# narrower level too; a cap with no default runs at it. A narrower level may
# not exceed a broader one (tasks <= steps <= nodes <= work_item), and the
# flat form (`defaults: time_cap_minutes: 30`) is refused, naming the level
# form.
#
# A work item freezes its policy when it is filed: this file, then the
# repository's `policy:` in repos.yaml, then the chain's, node's, step's and
# task's. A layer that relaxes what it inherits is refused then, not mid-run.
# What each field does to a running task:
#
#   allowed_tools      tools an agent may use. Claude launches with only the
#                      listed built-ins (--tools) in a mode that asks the
#                      permission gate about everything else. Unset allows
#                      every tool; `[]` allows none. A harness that cannot
#                      enforce a tool list (gemini) refuses to launch
#                      under one.
#   token_budget       tokens, in and out, the launches inside a scope may
#                      spend before the next agent task there is refused --
#                      that scope's own spend, not the whole item's. Set on
#                      any scope; a child's cannot exceed its parent's.
#                      Checked like budget.work_item_usd, which with
#                      budget.daily_usd stays the outer ceiling.
#                      Launches that start together in one scope each pass
#                      the check before any has spent, so a shared cap can be
#                      overshot by their cost.
#   budget_usd         the same, in dollars. A launch whose harness reported
#                      no cost is unknown spend, never free: a scope with some
#                      stops for a human rather than pass its dollar cap.
#   allowed_harnesses  profiles an agent task may select; checked at intake
#                      and again at launch.
#   escalation_harness the harnesses.yaml profile an escalation turn runs on,
#                      read at the node the item stopped at. Unset is claude;
#                      `item` follows the profile the item's own latest agent
#                      task ran on. An unknown profile is refused here.
#   max_attempts       a node's fix-loop attempts, and timeout_minutes its wall
#   timeout_minutes    clock -- under the loop's own `max_attempts` and an
#                      operator's per-item node override, over loops:/default:.
#   time_cap_minutes   a scope's running time: a task's one run, a step's or a
#                      node's task runs since it started, the work item's
#                      since it started. Paused, waiting, gate and
#                      rate-limited time does not count. Hitting it stops the
#                      running process and the item, for a human, naming the
#                      scope; it is never a code failure.
#   total_time_cap_minutes  the same scope's wall clock: running time plus
#                      waits, gates and rate limits, less only a manual pause.
#                      A task's total is its running time, except a wait's:
#                      that is the wait's timeout, and a wait with none set
#                      and no tasks default runs to the tasks' maximum, or
#                      90 minutes when there is none.
#                      Both caps are set on any scope, and each caps its own:
#                      a child's cannot exceed its parent's (chain > node >
#                      step > task), and a layer that tries is refused when
#                      the item is filed.
#
# Last of all, a work item's own override (`kraft item create --policy`,
# `kraft item set-policy`) binds that one item, within these maxima. Its
# item-wide cap is the work item's own and may be raised above the chain's,
# up to `maxima.work_item` -- so a person unsticks a capped item by raising
# it and retrying; one on a path may pass its level's default, up to its
# level's maximum, and only tightens what the chain set.
#
# Everything is commented out, because an uncommented value here is a real
# ceiling. An unset maximum is no bound at all, which is what a fresh install
# should ship with — Kraft must not silently cap an operator who never chose a
# number.
# defaults:
#   timeout_minutes: 60
#   max_attempts: 3
#   allowed_harnesses: [codex, claude]
#   escalation_harness: claude
#   work_item: { time_cap_minutes: 480, total_time_cap_minutes: 2880, budget_usd: 20 }
#   nodes:     { time_cap_minutes: 180 }
#   steps:     { time_cap_minutes: 120 }
#   tasks:     { time_cap_minutes: 90 }   # the shipped implementer sets 120
# maxima:
#   timeout_minutes: 180
#   allowed_harnesses: [codex, claude]
#   work_item: { time_cap_minutes: 1440, token_budget: 2000000, budget_usd: 25 }
#   tasks:     { time_cap_minutes: 240, total_time_cap_minutes: 10080 }  # a week: the seeded approval wait's 7d
#
# Note the work item's total_time_cap_minutes counts its gates and waits: at
# 2880 (two days) an item still waiting on the seeded 7-day approval stops
# for a person after two days.
