# Temporary: checks whether `gh pr comment --attach` works with Actions'
# GITHUB_TOKEN. Removed before this pull request merges.
name: attach-test
on:
  pull_request:
    paths: [".github/workflows/attach-test.yml"]
permissions:
  contents: write
  pull-requests: write
jobs:
  attach:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gh with --attach (2.99.0 or newer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          gh release download --repo cli/cli --pattern 'gh_*_linux_amd64.tar.gz' -O gh.tgz
          tar xzf gh.tgz
          sudo cp gh_*_linux_amd64/bin/gh /usr/local/bin/gh
          hash -r; gh --version
          gh pr comment --help | grep -i attach
      - name: attach to a comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body "attach test (comment): ![board](.github/assets/board.png)" \
            --attach ".github/assets/board.png#The board"
      - name: attach into the body
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --json body -q .body > body.md
          printf '\n\n<!-- attach-test -->\n![analytics](.github/assets/analytics.png)\n' >> body.md
          gh pr edit "$PR" --body-file body.md --attach ".github/assets/analytics.png#Analytics"
          gh pr view "$PR" --json body -q .body | tail -3
