# Everything runs on every pull request, except that a docs-only one skips the
# heavy jobs (see `changes`). The GitLab config this replaced gated each job
# behind `changes:` rules because free-tier minutes were scarce. Public
# repositories have unlimited Actions minutes, so the reason now is wall-clock
# and runner queue, not cost. Gating is per job, by `if:`, never by a
# workflow-level `paths:` filter: a filtered workflow reports no checks at all,
# and a required check that never reports blocks a pull request forever. A job
# skipped by its own `if:` reports "skipped", which satisfies a required check.
name: test

on:
  pull_request:
    # `labeled`/`unlabeled` matter: release-impact reads the labels off the
    # event payload, so without them, adding the label a failing check asked
    # for would not re-run that check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default for every job below that doesn't declare its own
# block (only `test` does, for its PR-comment and coverage-push steps).
permissions:
  contents: read

env:
  BD_VERSION: "1.2.2"
  # Every job but the `test` matrix runs on the newest supported Python. With a
  # floor of 3.12, an unpinned `uv sync` would take whatever 3.12+ the runner
  # has. The `test` matrix sets its own at job level.
  UV_PYTHON: "3.14"

jobs:
  changes:
    # `code` is false only for a pull request whose every changed path is
    # prose nothing in the heavy jobs reads: root-level *.md, docsite/ (docs.yml
    # builds it), .github/assets/, and docs/*.md (not docs/intent/, whose pins
    # the test job checks). Pushes to main run everything, and so does a PR if
    # this job fails: the heavy jobs skip only on an explicit 'false'. The unit
    # tests that read those files still run, in `docs-tests`.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --name-only "$BASE" HEAD)
            if [ -z "$(printf '%s\n' "$files" | grep -vE '^([^/]+\.md|docsite/.*|\.github/assets/.*|docs/[^/]*\.md)$')" ]; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools-scm derives the version from tags; a shallow clone has
          # none and every build in it silently versions itself 0.1.dev1.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python dev/check_docs_coverage.py
      - run: uv run python dev/check_tests.py

  test:
    # The unit tier on every supported Python (`requires-python` in pyproject.toml
    # is the floor, 3.12; the newest is 3.14). One wheel serves all of them, so
    # this is the only place a version gap shows. Coverage, junit annotations and
    # the PR comment come from the newest leg only: one report, not three.
    # fail-fast off, so one version's failure doesn't hide another's.
    name: test (python ${{ matrix.python-version }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    # Job-level, so it beats the workflow's UV_PYTHON for `uv run` too: `uv run`
    # rebuilds the venv whenever UV_PYTHON names another version than the one
    # `uv sync` just installed into, which would test 3.14 three times.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    # checks: write is action-junit-report's annotations; pull-requests: write
    # is its optional PR comment and the coverage action's PR comment;
    # contents: write is the coverage action pushing history to its own
    # python-coverage-comment-action-data branch on pushes to main. A fork's
    # GITHUB_TOKEN is downgraded to read-only regardless of this block, so
    # granting it here doesn't widen what untrusted code can do.
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # No bd here, on purpose (Kraft-qmhfc): the unit tier fakes
      # kraft.adapters.beads, so a unit test that still reached the real
      # binary fails rather than quietly paying for Dolt. The e2e-cli job
      # below runs the tests that need bd.
      - name: git identity
        run: |
          git config --global user.email ci@kraft.invalid
          git config --global user.name "Kraft CI"
      - run: uv sync --frozen
      - if: matrix.python-version == '3.14'
        run: >
          uv run pytest -m "not e2e" -n auto
          --junitxml=junit.xml --cov=src/kraft --cov-report=xml:coverage.xml
      - if: matrix.python-version != '3.14'
        run: uv run pytest -m "not e2e" -n auto
      # ~1s, no tests run: catches a renamed pinned test the suite above would not.
      - run: uv run python -m kraft.intent
      - if: always() && matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
      # Skipped for forks: their GITHUB_TOKEN is read-only, so the annotation
      # step would just fail. Not gated on the event type -- only relevant on
      # pull_request, and there's no pull_request context on a push to main.
      - if: >-
          always() && matrix.python-version == '3.14' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: junit.xml
      # Runs on both pull_request (posts/updates the PR comment) and push to
      # main (writes history + badge to the data branch) -- see the action's
      # own heuristic for picking which. Push to main has no fork to gate on.
      - if: >-
          always() && matrix.python-version == '3.14' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-tests:
    # On a docs-only pull request, the unit tests that read a docs file stand
    # in for the skipped matrix: a test that parses a docsite page's policy
    # example, the README's install URL, docs/templates-v1-design.md's YAML. The
    # grep names the same trees `changes` calls docs-only, so a new test that
    # reads one is picked up without editing a list. Python 3.14 only, like
    # every job but the matrix.
    name: docs tests
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: git identity
        run: |
          git config --global user.email ci@kraft.invalid
          git config --global user.name "Kraft CI"
      - run: uv sync --frozen
      - run: |
          git grep -lE 'docsite|"docs"|docs/|\.github/assets|"assets"|[A-Z_]+\.md' -- 'tests/**/test_*.py' 'tests/test_*.py' > "$RUNNER_TEMP/docs-tests.txt"
          cat "$RUNNER_TEMP/docs-tests.txt"
          xargs uv run pytest -m "not e2e" -n auto < "$RUNNER_TEMP/docs-tests.txt"

  test-gate:
    # One check named exactly `test`, for branch protection to require. The matrix
    # above reports as `test (python 3.12)`, `test (python 3.13)`, ... so a rule
    # naming each leg has to be edited whenever the supported range changes; a
    # rule naming this job never does.
    #
    # `if: always()` is load-bearing. A job skipped because its `needs` failed
    # reports "skipped", and a skipped required check passes -- so without it a
    # red matrix would leave this check green. The shell test below is what
    # turns a failed or cancelled matrix into a failed check. A skipped matrix
    # passes only when `changes` said docs-only and `docs-tests` passed.
    name: test
    needs: [changes, test, docs-tests]
    if: always()
    runs-on: ubuntu-latest
    env:
      CODE: ${{ needs.changes.outputs.code }}
      MATRIX_RESULT: ${{ needs.test.result }}
      DOCS_RESULT: ${{ needs.docs-tests.result }}
    steps:
      - run: |
          if [ "$CODE" = false ] && [ "$MATRIX_RESULT" = skipped ]; then
            if [ "$DOCS_RESULT" != success ]; then
              echo "::error::docs-only change: docs tests finished '$DOCS_RESULT', not 'success'"
              exit 1
            fi
            echo "docs-only change: test matrix skipped, docs tests passed"
          elif [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::the test matrix finished '$MATRIX_RESULT', not 'success'"
            exit 1
          fi

  e2e-cli:
    # The e2e tier (Ruling 153): tests that run a real external CLI to check
    # its contract -- today bd's argv, subcommands and --json shape, and the
    # bead behaviour Kraft relies on. Not a required check yet; that is Omid's
    # call. KRAFT_E2E_REQUIRE=bd,docker,podman makes a missing bd, docker or
    # podman an error instead of a green job that skipped everything; the
    # runner's own docker daemon and its rootless podman run the sandbox's
    # ref-store test against a real container each. The paid
    # claude test skips, and -rs prints why.
    name: e2e (real CLIs)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: install bd
        run: |
          case "$(uname -m)" in aarch64|arm64) BD_ARCH=arm64 ;; *) BD_ARCH=amd64 ;; esac
          curl -fsSL "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_${BD_ARCH}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin bd
          git config --global user.email ci@kraft.invalid
          git config --global user.name "Kraft CI"
          bd version
      - run: uv sync --frozen
      - run: uv run pytest -m e2e -n auto -rs --junitxml=e2e-junit.xml
        env:
          KRAFT_E2E_REQUIRE: bd,docker,podman
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-reports
          path: e2e-junit.xml

  lite-floor:
    # The kraft-lite plugin claims to need "python3 and nothing else". Both ends
    # of the supported range, because the floor is what a system python3
    # actually is on an older machine, and claiming it without testing it is how
    # that claim quietly becomes false. This folds in what
    # plugins/.github/workflows/test.yml used to run in the published repo --
    # which was one step too late, after a bad publish had reached users.
    #
    # `--no-project` is required: this repo's pyproject demands >=3.12 and uv
    # refuses the 3.10 interpreter without it. No lockfile and nothing but
    # pytest, so a dependency appearing here is the first sign the plugin
    # stopped being stdlib-only.
    name: kraft-lite on python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --python ${{ matrix.python-version }} --no-project --with pytest pytest plugins/kraft-lite/tests -q

  frontend:
    name: frontend
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  vscode:
    name: vscode
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history so the from-source daemon reports its real version, not
        # setuptools-scm's no-tag fallback (0.1.devN).
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # No bd, as in every job but e2e-cli (Kraft-qmhfc): dev/seed.py skips
      # `bd init` without it and intake files no bead. The seed commits, so it
      # needs a git identity.
      - name: git identity
        run: |
          git config --global user.email ci@kraft.invalid
          git config --global user.name "Kraft CI"
      - run: npm ci
        working-directory: vscode
      - run: npm run typecheck
        working-directory: vscode
      - run: npm test
        working-directory: vscode
      # VS Code's window sometimes hangs under xvfb ("CodeWindow: detected
      # unresponsive", exit 1, no assertion failed). The tests are stateful, so
      # a retry restarts the whole runner: fresh daemon, fresh seed.
      - run: |
          xvfb-run -a npm run test:integration || {
            echo "::warning::vscode integration failed once; retrying on a fresh daemon"
            xvfb-run -a npm run test:integration
          }
        working-directory: vscode

  e2e:
    # The browser counterpart to the gated Python e2e tier. The image tag and
    # frontend/package.json's exact "@playwright/test" pin must move together:
    # the image ships only the browsers its own version expects.
    name: playwright
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install uv, bd and git config
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl python3
          case "$(uname -m)" in aarch64|arm64) BD_ARCH=arm64 ;; *) BD_ARCH=amd64 ;; esac
          curl -fsSL "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_${BD_ARCH}.tar.gz" \
            | tar -xz -C /usr/local/bin bd
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config --global user.email ci@kraft.invalid
          git config --global user.name "Kraft CI"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # What a real install has: Kraft's MCP server registered with Claude
      # Code. A Claude launch without one is refused
      # (`registration.permission_tool`), fake agent or not.
      - name: register kraft with claude code
        run: echo '{"mcpServers":{"kraft":{"command":"kraft","args":["admin","mcp"]}}}' > ~/.claude.json
      - name: start the harness server
        run: |
          uv run python frontend/e2e/serve.py > e2e-server.log 2>&1 &
          for i in $(seq 1 60); do grep -q KRAFT_E2E_REPO e2e-server.log && break; sleep 1; done
          {
            echo "KRAFT_E2E_REPO=$(sed -n 's/.*KRAFT_E2E_REPO=//p' e2e-server.log)"
            echo "KRAFT_E2E_BASE=$(sed -n 's/.*KRAFT_E2E_BASE=//p' e2e-server.log)"
          } >> "$GITHUB_ENV"
      - name: the harness actually came up
        run: |
          test -n "$KRAFT_E2E_REPO" || { cat e2e-server.log; exit 1; }
          test -n "$KRAFT_E2E_BASE" || { cat e2e-server.log; exit 1; }
      # Bail after 3 failures instead of paying the full 120s timeout serially
      # for every spec: a systemic break turns a ~1min green run into over an
      # hour of dead runner time otherwise.
      - run: npm run e2e -- --max-failures=3
        working-directory: frontend
      - if: always()
        run: cat e2e-server.log || true

  removals-declared:
    # Kraft-79382: a pull request that reverts merged work stays green when
    # the tests pinning that work leave with it. Every test and intent
    # `## REQ` a PR removes must be listed in its body (docs/testing.md,
    # "Removing a test").
    name: removals declared
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The project's floor Python, not the runner's default: the tests it parses
      # must be valid on it (Kraft-neyhg). Stdlib only, so nothing is synced.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The body is read live, not off the event payload: a re-run replays the
      # original payload, and re-running this job after editing the body is
      # how a declaration is picked up.
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/pr-body.md"
          uv run --python 3.12 --no-project python dev/check_removals.py "$BASE" "$RUNNER_TEMP/pr-body.md"

  release-impact:
    # Every pull request declares what it ships. The version comes from the git
    # tag, so there is no bump commit left to forget -- which means the only
    # place anyone can be asked is here, while the author still knows what the
    # change is worth. `release::none` is a first-class answer and the expected
    # one for docs, comments, CI config and test-only changes.
    #
    # Skipped for forks on purpose. Only people with write access can label a
    # pull request, so requiring a label from an outside contributor is a red X
    # they have no way to clear. For a fork, the maintainer labels before
    # merging; an unlabelled merge stops the next release until it is labelled.
    name: release impact declared
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python3 dev/next_tag.py "" "$LABELS" > /dev/null || {
            echo "This PR needs exactly one of: release::major, release::minor, release::patch, release::none"
            exit 1
          }
          echo "declared: $LABELS"
