# Everything runs on every pull request, except that a docs-only one skips the
# heavy jobs (see `changes`). The GitLab config this replaced gated each job
# behind `changes:` rules because free-tier minutes were scarce. Public
# repositories have unlimited Actions minutes, so the reason now is wall-clock
# and runner queue, not cost. Gating is per job, by `if:`, never by a
# workflow-level `paths:` filter: a filtered workflow reports no checks at all,
# and a required check that never reports blocks a pull request forever. A job
# skipped by its own `if:` reports "skipped", which satisfies a required check.
name: test

on:
  pull_request:
    # Not `labeled`/`unlabeled`: a label change would start a second run on the
    # same head sha, and concurrency would cancel the first, leaving a CANCELLED
    # check run for every required name that blocks the merge. The label check
    # is its own workflow, pr-labels.yml.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default for every job below that doesn't declare its own
# block (only `test` does, for its PR-comment and coverage-push steps).
permissions:
  contents: read

env:
  BD_VERSION: "1.2.2"
  # Every job but the `test` matrix runs on the newest supported Python. With a
  # floor of 3.12, an unpinned `uv sync` would take whatever 3.12+ the runner
  # has. The `test` matrix sets its own at job level.
  UV_PYTHON: "3.14"

jobs:
  changes:
    # `code` is false only for a pull request whose every changed path is
    # prose nothing in the heavy jobs reads: root-level *.md, docsite/ (docs.yml
    # builds it), .github/assets/, and docs/*.md (not docs/intent/, whose pins
    # the test job checks). `python` is false for those and for one that also
    # changes frontend/, with nothing else and no .py file among them: no
    # Python moved, so the unit shards and the real-CLI tier have nothing new
    # to say. Pushes to main run everything, and so does a PR if this job
    # fails: the heavy jobs skip only on an explicit 'false'. The unit tests
    # that read the changed trees still run, in `docs-tests`.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      python: ${{ steps.diff.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          python=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # --no-renames: a rename is named by its new path alone, and a
            # Python file moved into docs/ would read as a docs change.
            files=$(git diff --name-only --no-renames "$BASE" HEAD)
            docs='[^/]+\.md|docsite/.*|\.github/assets/.*|docs/[^/]*\.md'
            if [ -z "$(printf '%s\n' "$files" | grep -vE "^($docs)$")" ]; then
              code=false
            fi
            # A .py file is Python wherever it lives: frontend/e2e/serve.py.
            if [ -z "$(printf '%s\n' "$files" | grep -vE "^($docs|frontend/.*)$")" ] &&
              ! printf '%s\n' "$files" | grep -qE '\.py$'; then
              python=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "python=$python" | tee -a "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools-scm derives the version from tags; a shallow clone has
          # none and every build in it silently versions itself 0.1.dev1.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python dev/check_docs_coverage.py
      # Here, not in docs.yml: this job has no `if:`, so it runs on a
      # docs-only pull request, which is where a wall of text arrives.
      - run: uv run python dev/check_docs_walls.py
      - run: uv run python dev/check_docs_redirects.py
      - run: uv run python dev/check_docs_landings.py
      - run: uv run python dev/check_docs_shell.py
      - run: uv run python dev/check_tests.py

  test:
    # The unit tier on every supported Python (`requires-python` in pyproject.toml
    # is the floor, 3.12; the newest is 3.14), each in three shards
    # (`KRAFT_TEST_SHARD`, read by the repo-root conftest.py). One wheel serves
    # all of them, so this is the only place a version gap shows. Coverage and
    # junit come from the newest Python only, one file per shard, and
    # `test-report` below puts them together. fail-fast off, so one leg's
    # failure doesn't hide another's.
    name: test (python ${{ matrix.python-version }}, ${{ matrix.shard }}/3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        shard: [1, 2, 3]
    # Job-level, so it beats the workflow's UV_PYTHON for `uv run` too: `uv run`
    # rebuilds the venv whenever UV_PYTHON names another version than the one
    # `uv sync` just installed into, which would test 3.14 three times.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # No bd here, on purpose (Kraft-qmhfc): the unit tier fakes
      # kraft.adapters.beads, so a unit test that still reached the real
      # binary fails rather than quietly paying for Dolt. The e2e-cli job
      # below runs the tests that need bd.
      - name: git identity
        run: |
          git config --global user.email ci@kraft.invalid
          git config --global user.name "Kraft CI"
      - run: uv sync --frozen
      # `-n logical`, not `-n auto`: psutil is installed (Kraft depends on it),
      # so `auto` counts physical cores and starts 2 workers on a runner with
      # 4 CPUs. `--durations` keeps the slowest tests in every log.
      #
      # KRAFT_TEST_SHARD is set on these two steps only. The intent check
      # below collects the whole suite, and must not see it.
      - if: matrix.python-version == '3.14'
        env:
          KRAFT_TEST_SHARD: ${{ matrix.shard }}/3
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
        run: >
          uv run pytest -m "not e2e" -n logical --durations=25
          --junitxml=junit-${{ matrix.shard }}.xml --cov=src/kraft --cov-report=
      - if: matrix.python-version != '3.14'
        env:
          KRAFT_TEST_SHARD: ${{ matrix.shard }}/3
        run: uv run pytest -m "not e2e" -n logical --durations=25
      # ~5s, no tests run: catches a renamed pinned test the suite above would
      # not. Once per Python, not once per shard.
      - if: matrix.shard == 1
        run: uv run python -m kraft.intent
      - if: always() && matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-shard-${{ matrix.shard }}
          # .coverage.N is a dotfile, which the action leaves out by default.
          include-hidden-files: true
          path: |
            junit-${{ matrix.shard }}.xml
            .coverage.${{ matrix.shard }}

  test-report:
    # One set of junit annotations and one coverage comment for the three
    # shards. Not in `test-gate`: it reports on the tests and checks nothing
    # itself, so a comment that could not be posted does not block a merge.
    # It does not run when the shards were skipped (no Python changed).
    name: test report
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    # checks: write is action-junit-report's annotations; pull-requests: write
    # is its optional PR comment and the coverage action's PR comment;
    # contents: write is the coverage action pushing history to its own
    # python-coverage-comment-action-data branch on pushes to main. A fork's
    # GITHUB_TOKEN is downgraded to read-only regardless of this block, so
    # granting it here doesn't widen what untrusted code can do.
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      # The coverage action reads the source files the data names, and
      # compares against the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-shard-*
          merge-multiple: true
      # The name tools and people already download: every shard's junit.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: junit-*.xml
      # Skipped for forks: their GITHUB_TOKEN is read-only, so the annotation
      # step would just fail. Only relevant on pull_request; there's no
      # pull_request context on a push to main.
      - if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: junit-*.xml
      # On pull_request it posts or updates the PR comment; on push to main it
      # writes history and the badge to the data branch. Only when every shard
      # passed: a shard that died wrote no data, and three shards' worth of
      # coverage from two would read as a drop.
      - if: >-
          needs.test.result == 'success' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_COVERAGE_FILES: true

  docs-tests:
    # On a pull request that changes no Python, the unit tests that read a
    # changed tree stand in for the skipped shards: a test that parses a docsite
    # page's policy example, the README's install URL, a frontend type a Python
    # model mirrors. The grep names the same trees `changes` does, so a new test
    # that reads one is picked up without editing a list; it is wide on purpose
    # (any test file that so much as mentions the tree). A test that reaches
    # one without naming it is caught on main, which runs everything. Python
    # 3.14 only, like every job but the shards.
    name: python tests (by path)
    needs: changes
    if: needs.changes.outputs.python == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: git identity
        run: |
          git config --global user.email ci@kraft.invalid
          git config --global user.name "Kraft CI"
      - run: uv sync --frozen
      - env:
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          trees='docsite|"docs"|docs/|\.github/assets|"assets"|[A-Z_]+\.md'
          # Not docs-only, so frontend/ changed too.
          if [ "$CODE" != false ]; then trees="$trees|\"frontend\"|frontend/"; fi
          git grep -lE "$trees" -- 'tests/**/test_*.py' 'tests/test_*.py' > "$RUNNER_TEMP/docs-tests.txt"
          cat "$RUNNER_TEMP/docs-tests.txt"
          xargs uv run pytest -m "not e2e" -n logical < "$RUNNER_TEMP/docs-tests.txt"

  test-gate:
    # One check named exactly `test` that stands for every job below that
    # checks the code, not just the Python matrix: a red lint, frontend,
    # playwright, ui contract, vscode or e2e job turns it red. The matrix reports as
    # `test (python 3.12)`, ... so a rule naming legs would need an edit
    # whenever the supported range changes; one naming this job never does.
    # Branch protection requires `test` today alongside each of those jobs by
    # name; once the ruleset names only `test` (with the kraft-lite checks and
    # the two pull-request-body checks), jobs can be added to or renamed in
    # this gate without a ruleset edit.
    #
    # `e2e (real CLIs)` is in it too. The release workflow already refuses a
    # main whose whole test run isn't green, so leaving it out would only move
    # its failure from the pull request that caused it to release day. Its one
    # infrastructure failure so far, a 504 fetching bd, is why both bd
    # downloads retry. "Re-run failed jobs" re-runs this gate with them.
    # `kraft-lite`, `removals declared` and the docs jobs are not: each is its
    # own check, and `removals declared` is re-run on its own after a body edit.
    #
    # `if: ${{ !cancelled() }}` is load-bearing. A job skipped because its
    # `needs` failed reports "skipped", and a skipped required check passes --
    # so a bare `needs` would leave this check green on a red job. Unlike
    # `always()`, `!cancelled()` is false once the whole run is cancelled, which
    # concurrency does to the first run when a push follows another on the same
    # pull request. That run's gate is then skipped instead of failed. Cancelled
    # runs sit on an older head sha, so they no longer count against the merge;
    # what once made a duplicate run on the *same* sha (a `labeled` event after
    # `opened`) is gone with the `labeled` trigger. Cost: a run cancelled by
    # hand also leaves a skipped gate, not a red one.
    #
    # The shell below reads every `needs` result. Each must be `success`, with
    # the exceptions that follow `changes`. On a pull request that changes no
    # Python, the unit shards and the real-CLI tier report `skipped`, which
    # passes, and `python tests (by path)` must then succeed. On a docs-only one
    # the frontend and browser jobs skip as well. On any other change
    # `python tests (by path)` is the one job expected to skip. Anything else
    # -- failure, cancelled, or a skip nobody asked for -- fails.
    # tests/test_ci_workflow.py runs this script on each of those cases.
    name: test
    needs: [changes, lint, test, docs-tests, e2e-cli, frontend, vscode, e2e, ui-contract]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      CODE: ${{ needs.changes.outputs.code }}
      PYTHON: ${{ needs.changes.outputs.python }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - run: |
          # Job ids, not check names: `e2e` is playwright, `e2e-cli` is
          # e2e (real CLIs), and `test` is the whole python matrix. Read into
          # a variable first, so a jq error fails the step instead of
          # vanishing inside a process substitution.
          results=$(jq -er 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS")
          if [ -z "$results" ]; then
            echo "::error::no job results to check"
            exit 1
          fi
          status=0
          fail() { echo "::error::$job finished '$result', not 'success'"; status=1; }
          while read -r job result; do
            echo "$job: $result"
            case "$job:$result:$CODE:$PYTHON" in
              *:success:*) ;;
              docs-tests:skipped:*:false) fail ;;  # no Python changed: it stands in for the shards
              docs-tests:skipped:*) ;;             # a Python change skips it
              # no Python changed: these two skip, and only they may
              test:skipped:*:false | e2e-cli:skipped:*:false) ;;
              # docs-only: the frontend and browser jobs skip too
              frontend:skipped:false:* | vscode:skipped:false:*) ;;
              e2e:skipped:false:* | ui-contract:skipped:false:*) ;;
              *) fail ;;
            esac
          done <<<"$results"
          exit "$status"

  e2e-cli:
    # The e2e tier (Ruling 153): tests that run a real external CLI to check
    # its contract -- today bd's argv, subcommands and --json shape, and the
    # bead behaviour Kraft relies on. A failure fails the `test` check (see
    # test-gate). KRAFT_E2E_REQUIRE=bd,docker,podman makes a missing bd,
    # docker or podman an error instead of a green job that skipped
    # everything; the runner's own docker daemon and its rootless podman run
    # the sandbox's ref-store test against a real container each. The paid
    # claude test skips, and -rs prints why.
    name: e2e (real CLIs)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: install bd
        run: |
          case "$(uname -m)" in aarch64|arm64) BD_ARCH=arm64 ;; *) BD_ARCH=amd64 ;; esac
          # To a file, not a pipe: a retry after a partial body would append
          # to what tar already read.
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/bd.tar.gz" \
            "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_${BD_ARCH}.tar.gz"
          sudo tar -xzf "$RUNNER_TEMP/bd.tar.gz" -C /usr/local/bin bd
          git config --global user.email ci@kraft.invalid
          git config --global user.name "Kraft CI"
          bd version
      - run: uv sync --frozen
      - run: uv run pytest -m e2e -n logical --durations=25 -rs --junitxml=e2e-junit.xml
        env:
          KRAFT_E2E_REQUIRE: bd,docker,podman
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-reports
          path: e2e-junit.xml

  lite-floor:
    # The kraft-lite plugin claims to need "python3 and nothing else". Both ends
    # of the supported range, because the floor is what a system python3
    # actually is on an older machine, and claiming it without testing it is how
    # that claim quietly becomes false. This folds in what
    # plugins/.github/workflows/test.yml used to run in the published repo --
    # which was one step too late, after a bad publish had reached users.
    #
    # `--no-project` is required: this repo's pyproject demands >=3.12 and uv
    # refuses the 3.10 interpreter without it. No lockfile and nothing but
    # pytest, so a dependency appearing here is the first sign the plugin
    # stopped being stdlib-only.
    name: kraft-lite on python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --python ${{ matrix.python-version }} --no-project --with pytest pytest plugins/kraft-lite/tests -q

  frontend:
    name: frontend
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  vscode:
    name: vscode
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history so the from-source daemon reports its real version, not
        # setuptools-scm's no-tag fallback (0.1.devN).
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # No bd, as in every job but e2e-cli (Kraft-qmhfc): dev/seed.py skips
      # `bd init` without it and intake files no bead. The seed commits, so it
      # needs a git identity.
      - name: git identity
        run: |
          git config --global user.email ci@kraft.invalid
          git config --global user.name "Kraft CI"
      - run: npm ci
        working-directory: vscode
      - run: npm run typecheck
        working-directory: vscode
      - run: npm test
        working-directory: vscode
      # VS Code's window sometimes hangs under xvfb ("CodeWindow: detected
      # unresponsive", exit 1, no assertion failed). The tests are stateful, so
      # a retry restarts the whole runner: fresh daemon, fresh seed.
      - run: |
          xvfb-run -a npm run test:integration || {
            echo "::warning::vscode integration failed once; retrying on a fresh daemon"
            xvfb-run -a npm run test:integration
          }
        working-directory: vscode

  e2e:
    # The browser counterpart to the gated Python e2e tier. The image tag and
    # frontend/package.json's exact "@playwright/test" pin must move together:
    # the image ships only the browsers its own version expects.
    name: playwright
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install uv, bd and git config
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl python3
          case "$(uname -m)" in aarch64|arm64) BD_ARCH=arm64 ;; *) BD_ARCH=amd64 ;; esac
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/bd.tar.gz" \
            "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_${BD_ARCH}.tar.gz"
          tar -xzf "$RUNNER_TEMP/bd.tar.gz" -C /usr/local/bin bd
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config --global user.email ci@kraft.invalid
          git config --global user.name "Kraft CI"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # What a real install has: Kraft's MCP server registered with Claude
      # Code. A Claude launch without one is refused
      # (`registration.permission_tool`), fake agent or not.
      - name: register kraft with claude code
        run: echo '{"mcpServers":{"kraft":{"command":"kraft","args":["admin","mcp"]}}}' > ~/.claude.json
      - name: start the harness server
        run: |
          uv run python frontend/e2e/serve.py > e2e-server.log 2>&1 &
          for i in $(seq 1 60); do grep -q KRAFT_E2E_REPO e2e-server.log && break; sleep 1; done
          {
            echo "KRAFT_E2E_REPO=$(sed -n 's/.*KRAFT_E2E_REPO=//p' e2e-server.log)"
            echo "KRAFT_E2E_BASE=$(sed -n 's/.*KRAFT_E2E_BASE=//p' e2e-server.log)"
          } >> "$GITHUB_ENV"
      - name: the harness actually came up
        run: |
          test -n "$KRAFT_E2E_REPO" || { cat e2e-server.log; exit 1; }
          test -n "$KRAFT_E2E_BASE" || { cat e2e-server.log; exit 1; }
      # Bail after 3 failures instead of paying the full 120s timeout serially
      # for every spec: a systemic break turns a ~1min green run into over an
      # hour of dead runner time otherwise.
      - run: npm run e2e -- --max-failures=3
        working-directory: frontend
      - if: always()
        run: cat e2e-server.log || true

  ui-contract:
    # The UI contract (frontend/e2e/contract/): what the SPA does in a real
    # browser, on a mocked /api. The sidebar's pin and reveal, Esc and focus
    # order, the item header's cards, review, the document viewer, tooltips,
    # and the icon-only audit, which fails an icon-only control with no name
    # or tooltip. No Kraft server and no Python: the suite builds the SPA and
    # serves it with `vite preview`. Same image as `playwright`, whose browsers
    # match the exact "@playwright/test" pin.
    name: ui contract
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright test -c e2e/contract/playwright.config.ts
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-contract-failures
          path: frontend/test-results
          if-no-files-found: ignore

  removals-declared:
    # Kraft-79382: a pull request that reverts merged work stays green when
    # the tests pinning that work leave with it. Every test and intent
    # `## REQ` a PR removes must be listed in its body (docs/testing.md,
    # "Removing a test").
    name: removals declared
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The project's floor Python, not the runner's default: the tests it parses
      # must be valid on it (Kraft-neyhg). Stdlib only, so nothing is synced.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The body is read live, not off the event payload: a re-run replays the
      # original payload, and re-running this job after editing the body is
      # how a declaration is picked up.
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/pr-body.md"
          uv run --python 3.12 --no-project python dev/check_removals.py "$BASE" "$RUNNER_TEMP/pr-body.md"
