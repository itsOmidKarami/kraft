# Cut a release by hand: Actions -> release -> Run workflow. Everything merged
# into main since the previous tag goes out together, bumped by the largest
# `release::` label among those pull requests (two minors and three patches is
# a minor), with notes built from each one's `## Changelog` section. Tick
# "dry run" to see the version and notes without releasing anything. Give a
# commit to release an earlier point on main than its tip -- say, while the
# tip's tests are still running.
#
# One job, not a tag-triggered second workflow: a tag pushed with the default
# GITHUB_TOKEN deliberately does not trigger other workflows, and keeping it in
# one job means no stored PAT, the credential you least want in a public repo.
#
# Pick alpha, beta or rc to cut a pre-release of the version the labels plan
# (v1.3.0rc1, then rc2 ...). It is a GitHub pre-release, so `kraft admin update
# --channel` can find it and nothing else does. Only an rc goes to PyPI; alpha and
# beta stay on GitHub. None of them touch homebrew, the stamp PR, or the
# Marketplace, and the next stable's notes still cover everything since the last
# stable tag.
#
# A dry run stops after the notes: every step below that builds, packs or
# publishes is skipped, so it cannot exercise them. RELEASING.md says what a
# run publishes and how to check each target.
#
# Order matters. The tag is created locally first (setuptools-scm reads the
# version from it, so the wheel cannot be built before it exists), and pushed
# only after the wheel has built and passed its smoke test. A failed build
# therefore leaves no tag behind to clean up.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the version and notes, release nothing"
        type: boolean
        default: false
      pre:
        description: "Cut a pre-release instead of a stable release"
        type: choice
        options: [none, alpha, beta, rc]
        default: none
      sha:
        description: "Commit on main to release (empty: main's tip)"
        type: string
        default: ""

permissions:
  contents: write      # create the tag and the release
  id-token: write      # PyPI trusted publishing
  pull-requests: write # read the merged PRs' labels; open the stamp PR
  actions: write       # check main's test run; dispatch the docs rebuild

jobs:
  release:
    runs-on: ubuntu-latest
    # The button offers every branch; only main releases.
    if: github.ref == 'refs/heads/main'
    # The `if:` above lives in a file a branch can edit; this does not. The
    # environment only deploys from main (repo settings), and PyPI's trusted
    # publisher is pinned to it, so a run from any other ref cannot publish.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git tag --merged` needs the tags and the history, and a shallow
          # clone has neither -- every release would compute as the first one.
          fetch-depth: 0
          # No write token left in .git/config for `npm ci`'s install scripts
          # and the build to read; the tag push passes it explicitly.
          persist-credentials: false

      - name: what does this release ship
        id: impact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          WANT: ${{ inputs.sha }}
          PRE: ${{ inputs.pre }}
        run: |
          # Resolved here rather than by actions/checkout's `ref:`, which
          # takes no short SHA. Later steps build whatever HEAD this leaves,
          # but the release tooling is main's: an older commit's copy may
          # predate a fix to it, or not exist at all.
          cp -R dev "$RUNNER_TEMP/dev"
          if [ -n "$WANT" ]; then
            if ! SHA=$(git rev-parse --verify --quiet "$WANT^{commit}"); then
              echo "::error::'$WANT' is not a commit in this repository"
              exit 1
            fi
            git -c advice.detachedHead=false checkout --quiet --detach "$SHA"
          fi
          SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main; only main releases"
            exit 1
          fi
          # PyPI publishes cannot be undone, so the commit being released must
          # have passed its tests on main -- not be still running, not failed.
          TESTS=$(gh run list --workflow test --branch main --event push --commit "$SHA" \
            --json status,conclusion \
            --jq 'if .[0] == null then "missing" elif .[0].status != "completed" then .[0].status else .[0].conclusion end')
          if [ "$TESTS" != "success" ]; then
            echo "::error::test on main at $SHA is '$TESTS', not success; wait for it or fix main"
            exit 1
          fi
          # Every exact `vX.Y.Z` tag reachable from main, highest by version
          # order. A repo can carry more than one malformed rc tag on the very
          # commit rc1 shipped from (a ruleset can block deleting the wrong
          # one), so `git describe` excluding a couple of glob shapes is not
          # enough -- `v1.0.0rc1`, `v1.0.0.rc1` and `v1.0.0-rc.1` all fail the
          # anchored regex and never enter the running.
          PREVIOUS=$(git tag --list --merged "$SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          # A commit behind the newest release would recompute a tag that
          # already exists, or one numbered below it.
          LATEST=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$LATEST" != "$PREVIOUS" ]; then
            echo "::error::$SHA is behind $LATEST, already released; pick a commit after it"
            exit 1
          fi
          RANGE=${PREVIOUS:+$PREVIOUS..}$SHA
          # The pull request behind each commit since the previous tag. A
          # commit with none -- a direct push, the revert button -- carries no
          # declaration and adds nothing to the bump or the notes. A call that
          # still fails after its retries stops the step: a list missing PRs
          # would ship wrong notes, or the wrong version. The loop writes to a
          # file, not into a pipe, so errexit cannot be swallowed by `jq -s`.
          : > "$RUNNER_TEMP/pr-lines.json"
          for c in $(git rev-list --first-parent "$RANGE"); do
            for TRY in 1 2 3 4 5; do
              P=$(gh api "repos/$GITHUB_REPOSITORY/commits/$c/pulls" \
                --jq '.[0] // empty | {number, title, body, labels: [.labels[].name]}') && break
              if [ "$TRY" = 5 ]; then
                echo "::error::could not list the pull request behind $c after $TRY tries"
                exit 1
              fi
              sleep $((2 ** TRY))
            done
            printf '%s\n' "$P" >> "$RUNNER_TEMP/pr-lines.json"
          done
          jq -s 'unique_by(.number)' "$RUNNER_TEMP/pr-lines.json" > "$RUNNER_TEMP/prs.json"
          # No `|| true`: plan_release exits non-zero on an unlabelled PR or a
          # tag it cannot read, and swallowing that would turn it into a
          # silently skipped release.
          TAG=$(python3 "$RUNNER_TEMP/dev/plan_release.py" plan "$PREVIOUS" "$RUNNER_TEMP/prs.json" "$RUNNER_TEMP/notes.md")
          if [ -n "$TAG" ] && [ "$PRE" != "none" ]; then
            TAG=$(git tag --list | python3 "$RUNNER_TEMP/dev/plan_release.py" pre "$TAG" "$PRE")
          else
            PRE=none
          fi
          # An image a `## Changelog` section hot-links from main shows this
          # tag's copy, in the release and in both changelogs.
          if [ -n "$TAG" ]; then
            python3 "$RUNNER_TEMP/dev/release_artifacts.py" pin-notes "$RUNNER_TEMP/notes.md" "$TAG"
          fi
          # The GitHub Release's text. A pre-release's opens with how to install
          # it; a stable one's is notes.md as it is. The changelogs take notes.md.
          python3 "$RUNNER_TEMP/dev/plan_release.py" body "$TAG" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/body.md"
          {
            echo "## ${TAG:-No release} (previous: ${PREVIOUS:-none})"
            echo
            cat "$RUNNER_TEMP/body.md"
          } >> "$GITHUB_STEP_SUMMARY"
          # The log too: the API serves job logs but not the summary page. The
          # notes are PR text, so a line opening with `::` must not run as a
          # workflow command.
          STOP=$(openssl rand -hex 16)
          echo "::stop-commands::$STOP"
          cat "$RUNNER_TEMP/body.md"
          echo "::$STOP::"
          if [ -z "$TAG" ]; then
            echo "nothing since ${PREVIOUS:-the start} ships; not releasing"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "dry run: would release $TAG"
            TAG=
          else
            echo "releasing $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pre=$PRE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.impact.outputs.tag != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.impact.outputs.tag != ''
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: put uv-installed tools on PATH
        # `$GITHUB_PATH` only takes effect for later steps, not the one that
        # writes it -- hence its own step ahead of the one that runs `just`.
        # Insurance against the runner image not already putting
        # ~/.local/bin on PATH by default; GitLab's equivalent job did this
        # explicitly rather than relying on it.
        if: steps.impact.outputs.tag != ''
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: tag locally, then build
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
        run: |
          git -c user.email=ci@kraft.invalid -c user.name="Kraft CI" tag -a "$TAG" -m "$TAG"
          # Every zip entry dated by the tagged commit, not by when the bundle
          # was copied: anyone can rebuild the tag and get the published sha256.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv tool install rust-just==1.59.0
          npm ci --prefix frontend
          just bundle
          uv build --wheel

      - name: point the wheel's README at this tag
        # The README's images are hot-linked to `main`, and PyPI renders the
        # description baked into the wheel. Left alone, every version's PyPI
        # page would show whatever UI `main` has today. On a stable tag, its
        # links to `main`'s docs (`/next/`) move to the release's docs too. On
        # the built wheel, not README.md: editing the tree before the build
        # would make setuptools-scm
        # call the version a dev build (`1.5.0rc100.dev0+g...`), not the tag.
        # The tag is pushed below, before the publish, so the URLs resolve by
        # the time PyPI shows them.
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
        run: python3 "$RUNNER_TEMP/dev/release_artifacts.py" pin-wheel "$(ls dist/*.whl)" "$TAG"

      - name: smoke test the wheel
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
        run: |
          # A wheel that lost the SPA, or that versioned itself from a shallow
          # clone, must not become a release. This is the guard that makes
          # `just bundle` living outside the build backend survivable.
          WHEEL=$(ls dist/*.whl)
          # On the floor Python (`requires-python`), not the newest: one wheel
          # serves every version, so the oldest is the one it can break on.
          uv venv --python 3.12 /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install "$WHEEL"
          # The whole line, not a substring: `1.5.0` is inside `1.5.0rc11`.
          VERSION=$(/tmp/smoke/bin/kraft --version)
          if [ "$VERSION" != "kraft ${TAG#v}" ]; then
            echo "::error::the wheel says '$VERSION', not 'kraft ${TAG#v}'"
            exit 1
          fi
          # Ask the installed package where its bundle is, rather than guessing
          # a site-packages path that a python version bump would invalidate.
          /tmp/smoke/bin/python -c \
            "from kraft.paths import BUNDLED; import sys; sys.exit(0 if (BUNDLED / 'web' / 'index.html').is_file() else 1)"
          # The defaults a new home is seeded from: without them its first
          # start exits, naming no bundled defaults to seed it.
          if ! /tmp/smoke/bin/python -c \
              "from kraft.paths import BUNDLED; import sys; c = BUNDLED / 'config'; sys.exit(0 if (c / 'library.yaml').is_file() and (c / 'chains').is_dir() else 1)"; then
            echo "::error::the wheel has no kraft/_bundled/config with a library.yaml and chains/"
            exit 1
          fi
          # Never this machine's password hash or webhook: `just bundle` strips them.
          # unzip exits 11 when none of the named files is in the wheel, 0 when
          # one is, and anything else when it cannot read the wheel: only 11 passes.
          rc=0
          unzip -l "$WHEEL" kraft/_bundled/config/access.yaml kraft/_bundled/config/notify.yaml >/dev/null 2>&1 || rc=$?
          if [ "$rc" -ne 11 ]; then
            echo "::error::the wheel carries kraft/_bundled/config/access.yaml or notify.yaml, or unzip could not read it (exit $rc)"
            exit 1
          fi
          # The web UI bundles react, lucide-react, the Inter font and more, and
          # their licenses ask for their notices to go wherever their code does.
          if ! unzip -l "$WHEEL" kraft/_bundled/web/THIRD_PARTY_LICENSES.txt >/dev/null; then
            echo "::error::the wheel has no kraft/_bundled/web/THIRD_PARTY_LICENSES.txt"
            exit 1
          fi
          # And a description that still hot-links `main` would show main's UI
          # on this version's PyPI page for as long as the version exists.
          if unzip -p "$WHEEL" '*.dist-info/METADATA' \
              | grep -qiE "(raw\.githubusercontent\.com/$GITHUB_REPOSITORY|github\.com/$GITHUB_REPOSITORY/raw)/(main|master|HEAD)/"; then
            echo "::error::the wheel's README still points at main, not $TAG"
            exit 1
          fi

      - name: build the VS Code extension
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
        run: |
          # The version goes on the command line, not into package.json: the
          # stamp step below branches off a clean tree, and the wheel is already
          # built, so nothing may dirty the checkout here.
          cd vscode
          # The .vsix's zip entries dated by the tagged commit too, as the
          # wheel's are: vsce stamps every entry with it and sorts them, so a
          # rebuild of the tag gives the published sha256.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          npm ci
          # No `npm run build`: packing the .vsix below runs `vscode:prepublish`,
          # which builds the extension itself, without a source map.
          # A pre-release is packed as semver, `1.5.0-rc.2`, so it sorts below
          # the release it leads up to and a side-loaded rc is updated by the
          # real 1.5.0. Packing it as its base version made the two equal.
          VSIX_VERSION=$(python3 "$RUNNER_TEMP/dev/release_artifacts.py" vsix-version "$TAG")
          # The Changelog tab shows CHANGELOG.md from inside the .vsix, and the
          # stamp PR that writes this release's section lands after the build.
          # Add it here too, then put the file back: the stamp step below must
          # start from a clean tree.
          python3 "$RUNNER_TEMP/dev/plan_release.py" changelog "$VSIX_VERSION" "$RUNNER_TEMP/notes.md" CHANGELOG.md
          # Not in dist/: the PyPI publish step uploads everything there, and
          # PyPI rejects a .vsix (v1.2.0 stopped on exactly that).
          mkdir -p "$RUNNER_TEMP/vsix"
          # README.md links its screenshots relative to vscode/; vsce makes
          # them absolute, and without this flag points them at `HEAD`.
          npx vsce package "$VSIX_VERSION" --no-update-package-json \
            --baseImagesUrl "https://github.com/$GITHUB_REPOSITORY/raw/$TAG/vscode/" \
            --out "$RUNNER_TEMP/vsix/kraft-${TAG#v}.vsix"
          git checkout -- CHANGELOG.md
          # vsce points the Marketplace's Get Started link at the repository's
          # clone URL, `.git` and all, and has no setting for it.
          python3 "$RUNNER_TEMP/dev/release_artifacts.py" vsix-links "$RUNNER_TEMP/vsix/kraft-${TAG#v}.vsix"
          # The extension bundles `ws`, whose license asks for its notice to go
          # wherever its code does.
          if ! unzip -l "$RUNNER_TEMP/vsix/kraft-${TAG#v}.vsix" extension/dist/THIRD_PARTY_LICENSES.txt >/dev/null; then
            echo "::error::the .vsix has no extension/dist/THIRD_PARTY_LICENSES.txt"
            exit 1
          fi
          # `vsce package` builds with `--production`, which writes no source
          # map; the .vsix leaves *.map out, so a link to one would dangle.
          if unzip -p "$RUNNER_TEMP/vsix/kraft-${TAG#v}.vsix" extension/dist/extension.js | grep -q '^//# sourceMappingURL='; then
            echo "::error::the .vsix's extension.js links a source map it does not ship"
            exit 1
          fi

      - name: push the tag and create the release
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
          PRE: ${{ steps.impact.outputs.pre }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"
          gh release create "$TAG" $([ "$PRE" != none ] && echo --prerelease) dist/*.whl "$RUNNER_TEMP"/vsix/*.vsix --title "Kraft $TAG" --notes-file "$RUNNER_TEMP/body.md"

      - name: rebuild the docs for this release
        # The docs site serves the latest stable tag's pages at /. The
        # tag push above can't trigger docs.yml (GITHUB_TOKEN pushes trigger
        # nothing), and the stamp PR is outside its path filter, but a
        # dispatch with GITHUB_TOKEN is allowed. The docs are not the release:
        # a failed dispatch warns and never fails it.
        if: steps.impact.outputs.tag != '' && steps.impact.outputs.pre == 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docs.yml --ref main \
            || echo "::warning::docs rebuild not dispatched; run the docs workflow by hand"

      - name: publish to PyPI
        if: steps.impact.outputs.tag != '' && contains(fromJSON('["none","rc"]'), steps.impact.outputs.pre)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: mint a token to open the stamp PR
        # The default GITHUB_TOKEN deliberately can't do this part: GitHub
        # suppresses further workflow runs triggered by GITHUB_TOKEN, so a PR
        # opened with it would never fire test.yml -- its required status
        # checks would sit pending forever and auto-merge below would never
        # fire. A GitHub App installation token doesn't carry that
        # restriction, is scoped to just this repo (contents + pull-requests),
        # and isn't tied to a personal account the way a PAT would be.
        if: steps.impact.outputs.tag != '' && steps.impact.outputs.pre == 'none'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kraft

      - name: stamp plugin manifests and CHANGELOG.md for this release
        # Writing plugin.json's version and the CHANGELOG.md section here, not
        # on the PRs that make up the release, is the whole point: a value only
        # this job ever writes can never conflict with an in-flight PR, and no
        # PR has to guess what version it will ship in. `main` requires a pull
        # request (see the repo's branch ruleset), so this can't just push --
        # it opens a PR and lets required checks auto-merge it. That PR carries
        # release::none, so it adds nothing to the next release's bump.
        if: steps.impact.outputs.tag != '' && steps.impact.outputs.pre == 'none'
        env:
          TAG: ${{ steps.impact.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${TAG#v}"
          BRANCH="stamp-plugin-versions-$VERSION"
          # Off main's tip, not the released commit, which may be behind it.
          git checkout --quiet -b "$BRANCH" origin/main
          python3 dev/stamp_plugin_versions.py "$VERSION"
          # The docs' `_Added in next_` notes become this release's number
          # (see RELEASING.md). A patch that ships a feature is the one case
          # it refuses; that must not hold back the manifests or the changelog.
          DOCS_NOTE=""
          if ! python3 dev/stamp_docs_added_in.py "$VERSION" 2>"$RUNNER_TEMP/docs-notes.err"; then
            cat "$RUNNER_TEMP/docs-notes.err"
            echo "::warning::docs notes not stamped: $TAG is a patch release but pages carry _Added in next_"
            DOCS_NOTE=" The docs' \`_Added in next_\` notes were NOT stamped: $TAG is a patch release, so a feature shipped under a patch label. Relabel, or take the notes off by hand."
          fi
          # After the build, never before: a dirty tree would give the wheel a
          # setuptools-scm dev version and fail the smoke test.
          python3 dev/plan_release.py changelog "$VERSION" "$RUNNER_TEMP/notes.md"
          python3 dev/plan_release.py changelog "$VERSION" "$RUNNER_TEMP/notes.md" vscode/CHANGELOG.md
          git -c user.email=ci@kraft.invalid -c user.name="Kraft CI" \
            commit -am "chore: stamp plugin manifests and changelog for $TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: stamp plugin manifests and changelog for $TAG" \
            --body "Plugin manifest versions, the CHANGELOG.md section and the docs' Added in notes, written by the release workflow that just published $TAG.$DOCS_NOTE" \
            --label release::none
          gh pr merge "$BRANCH" --auto --squash

      - name: bump the homebrew tap
        # Points the formula at this run's own GitHub Release asset, not the
        # PyPI upload -- that one is already sha256-verified above and, unlike
        # querying PyPI's API, needs no wait for index propagation.
        if: steps.impact.outputs.tag != '' && steps.impact.outputs.pre == 'none'
        env:
          TAG: ${{ steps.impact.outputs.tag }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          WHEEL=$(ls dist/*.whl)
          SHA256=$(shasum -a 256 "$WHEEL" | cut -d' ' -f1)
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$WHEEL")"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/itsOmidKarami/homebrew-kraft" /tmp/homebrew-kraft
          cd /tmp/homebrew-kraft
          sed -i \
            -e "s#^  url \".*\"#  url \"$URL\"#" \
            -e "s#^  sha256 \".*\"#  sha256 \"$SHA256\"#" \
            Formula/kraft.rb
          git -c user.email=ci@kraft.invalid -c user.name="Kraft CI" commit -am "kraft ${TAG#v}"
          git push

      - name: check PyPI serves this release
        # v1.2.0 reached GitHub but never PyPI, and nothing said so. A publish
        # step that "passed" is not the same as the version being installable.
        if: steps.impact.outputs.tag != '' && steps.impact.outputs.pre == 'none'
        env:
          TAG: ${{ steps.impact.outputs.tag }}
        run: |
          for _ in $(seq 60); do
            curl -sfo /dev/null "https://pypi.org/pypi/kraft-sdlc/${TAG#v}/json" && exit 0
            sleep 10
          done
          echo "::error::kraft-sdlc ${TAG#v} is not on PyPI after 10 minutes"
          exit 1

      - name: sign in to Azure for the Marketplace
        id: azure-login
        # No token: the Marketplace publishes as an Azure managed identity,
        # `kraft-release-publisher`, a Contributor on the kraft-sdlc publisher.
        # Azure trusts this job only because its OIDC token says it runs in this
        # repository's `release` environment (the identity's federated
        # credential), so nothing expires or needs rotating, and only a run
        # from main can publish. The ids below name the identity; they are not
        # secrets. Azure DevOps personal access tokens are retired on
        # 2026-12-01, which is why this replaced the Marketplace token.
        if: steps.impact.outputs.tag != '' && steps.impact.outputs.pre == 'none'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: 4e55fc82-f899-43f4-9d7f-596b6cd930ec
          tenant-id: cd046f23-858b-4780-b1ff-7a7388ce9223
          allow-no-subscriptions: true

      - name: publish the VS Code extension
        id: marketplace-publish
        # Last, after Kraft itself is on PyPI, Homebrew and main. A failed step
        # stops every step after it, and the Marketplace login can lapse (the
        # identity removed from the publisher, the federated credential
        # deleted): run first, that left Homebrew on the old version and main
        # unstamped. Run here, it fails the run and skips only the extension's
        # own steps (never Open VSX, below). The order also suits VS Code's
        # auto-update: an extension newer than the daemon is read-only, so it
        # should not reach users before the Kraft that matches it can be
        # installed.
        if: steps.impact.outputs.tag != '' && steps.impact.outputs.pre == 'none'
        run: |
          VSIX=$(ls "$RUNNER_TEMP"/vsix/*.vsix)
          npx --prefix vscode vsce publish --packagePath "$VSIX" --azure-credential

      - name: publish the VS Code extension to Open VSX
        # No token: Open VSX trusted publishing, registered for kraft-sdlc.kraft
        # against this workflow and the `release` environment.
        #
        # Independent of the Marketplace: it needs no Azure login, so a lapsed
        # login or a failed Marketplace publish must not skip it. It runs when
        # everything before it passed, or when the only failure is the Azure
        # login or the Marketplace publish. If an earlier step failed (PyPI,
        # Homebrew, the stamp), the login is skipped, not failed, so this stays
        # out: the extension must not reach users before the Kraft it talks to.
        # `!cancelled()` is needed because any status function in `if:` turns
        # off the implicit `success()`; a `${{ }}` keeps YAML from reading `!`.
        if: ${{ !cancelled() && steps.impact.outputs.tag != '' && steps.impact.outputs.pre == 'none' && (success() || steps.azure-login.conclusion == 'failure' || steps.marketplace-publish.conclusion == 'failure') }}
        run: |
          VSIX=$(ls "$RUNNER_TEMP"/vsix/*.vsix)
          npx --prefix vscode ovsx publish "$VSIX" --trusted-publishing

      - name: check the Marketplace lists this release
        # Warns only: the Marketplace can take a while to index a publish.
        if: steps.impact.outputs.tag != '' && steps.impact.outputs.pre == 'none'
        env:
          TAG: ${{ steps.impact.outputs.tag }}
        run: |
          for _ in $(seq 30); do
            curl -sf https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
              -H 'Content-Type: application/json' -H 'Accept: application/json;api-version=3.0-preview.1' \
              -d '{"filters":[{"criteria":[{"filterType":7,"value":"kraft-sdlc.kraft"}]}],"flags":1}' \
              | jq -e --arg v "${TAG#v}" 'any(.results[0].extensions[0].versions[]?; .version == $v)' >/dev/null && exit 0
            sleep 10
          done
          echo "::warning::kraft-sdlc.kraft ${TAG#v} is not on the Marketplace after 5 minutes; check it by hand"
