# The merge landed. Read the label off the pull request that produced this
# commit, compute the tag, build the wheel, and publish it.
#
# One workflow, not two. The GitLab shape was `auto-tag` pushes a tag -> a tag
# pipeline builds and releases. That cannot work here: a tag pushed with the
# default GITHUB_TOKEN deliberately does not trigger other workflows, so the
# release half would never run. Keeping it in one job also means no stored PAT,
# which is the credential you least want in a public repository.
#
# Order matters. The tag is created locally first (setuptools-scm reads the
# version from it, so the wheel cannot be built before it exists), and pushed
# only after the wheel has built and passed its smoke test. A failed build
# therefore leaves no tag behind to clean up.
name: release

# Triggered by test.yml completing, not by the push itself: two workflows both
# triggered by `push: branches: [main]` run in parallel, which would let a tag
# get created, a GitHub Release published, and a wheel pushed to PyPI from a
# commit whose tests are still running -- or already failed. PyPI publishes
# cannot be undone, so this waits on the actual test result instead.
#
# `workflow_run` does not check out the pushing commit by default -- it runs
# against the default branch tip -- so every step below that needs "the commit
# this release is about" uses `github.event.workflow_run.head_sha` explicitly,
# never $GITHUB_SHA (which, under `workflow_run`, is not that commit).
on:
  workflow_run:
    workflows: ["test"]
    types: [completed]
    branches: [main]

permissions:
  contents: write      # create the tag and the release
  id-token: write      # PyPI trusted publishing
  pull-requests: write # read the merged PR's labels off the commit; open the stamp PR

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # `git describe` needs the tags, and a shallow clone has none --
          # every release would compute as the first one.
          fetch-depth: 0

      - name: what does this merge ship
        id: impact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          LABELS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
            --jq '[.[0].labels // [] | .[].name] | join(",")')
          # A commit that reached main without a pull request -- a direct push,
          # the revert button, a cherry-pick -- has no labels to read. That is
          # `none`, and saying so is what stops it looking like a broken job.
          if [ -z "$LABELS" ]; then
            echo "no pull request for $SHA; not releasing"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `git describe --abbrev=0` finds the nearest tag by commit graph
          # distance, prerelease or not -- and a repo can carry more than one
          # malformed rc tag on the very commit rc1 shipped from (a ruleset can
          # block deleting the wrong one), so excluding a couple of glob shapes
          # from `describe` is not enough to keep every prerelease form out.
          # List every exact `vX.Y.Z` release tag reachable from this commit
          # instead and take the highest by version order -- `v1.0.0rc1`,
          # `v1.0.0.rc1` and `v1.0.0-rc.1` all fail the anchored regex and never
          # enter the running.
          PREVIOUS=$(git tag --list --merged "$SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          # No `|| true`: next_tag exits 0 with no output for release::none, and
          # non-zero only when it cannot read the previous tag or the labels
          # contradict each other. Swallowing that would turn a broken tag
          # history into a silently skipped release.
          TAG=$(python3 dev/next_tag.py "$PREVIOUS" "$LABELS")
          if [ -z "$TAG" ]; then
            echo "release::none; not releasing"
          else
            echo "releasing $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.impact.outputs.tag != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.impact.outputs.tag != ''
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: put uv-installed tools on PATH
        # `$GITHUB_PATH` only takes effect for later steps, not the one that
        # writes it -- hence its own step ahead of the one that runs `just`.
        # Insurance against the runner image not already putting
        # ~/.local/bin on PATH by default; GitLab's equivalent job did this
        # explicitly rather than relying on it.
        if: steps.impact.outputs.tag != ''
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: tag locally, then build
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
        run: |
          git -c user.email=ci@kraft.invalid -c user.name="Kraft CI" tag -a "$TAG" -m "$TAG"
          uv tool install rust-just
          npm ci --prefix frontend
          just bundle
          uv build --wheel

      - name: smoke test the wheel
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
        run: |
          # A wheel that lost the SPA, or that versioned itself from a shallow
          # clone, must not become a release. This is the guard that makes
          # `just bundle` living outside the build backend survivable.
          WHEEL=$(ls dist/*.whl)
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install "$WHEEL"
          /tmp/smoke/bin/kraft --version | grep -qF "${TAG#v}"
          # Ask the installed package where its bundle is, rather than guessing
          # a site-packages path that a python version bump would invalidate.
          /tmp/smoke/bin/python -c \
            "from kraft.paths import BUNDLED; import sys; sys.exit(0 if (BUNDLED / 'web' / 'index.html').is_file() else 1)"

      - name: push the tag and create the release
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "$TAG"
          gh release create "$TAG" dist/*.whl --title "Kraft $TAG" --generate-notes

      - name: publish to PyPI
        if: steps.impact.outputs.tag != ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: mint a token to open the stamp PR
        # The default GITHUB_TOKEN deliberately can't do this part: GitHub
        # suppresses further workflow runs triggered by GITHUB_TOKEN, so a PR
        # opened with it would never fire test.yml -- its required status
        # checks would sit pending forever and auto-merge below would never
        # fire. A GitHub App installation token doesn't carry that
        # restriction, is scoped to just this repo (contents + pull-requests),
        # and isn't tied to a personal account the way a PAT would be.
        if: steps.impact.outputs.tag != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kraft

      - name: stamp plugin manifests for this release
        # Writing plugin.json's version here, not on the PR that triggers a
        # release, is the whole point: a value only this job ever writes can
        # never conflict with an in-flight PR, and nothing has to guess ahead
        # of time what version a merge will produce. `main` requires a pull
        # request (see the repo's branch ruleset), so this can't just push --
        # it opens a PR and lets required checks auto-merge it. That PR carries
        # release::none, so its own merge back into main is a no-op for this
        # same workflow (next_tag.py produces no tag for an unlabelled/none
        # merge) rather than triggering a second release.
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${TAG#v}"
          BRANCH="stamp-plugin-versions-$VERSION"
          python3 dev/stamp_plugin_versions.py "$VERSION"
          git -c user.email=ci@kraft.invalid -c user.name="Kraft CI" \
            checkout -b "$BRANCH"
          git -c user.email=ci@kraft.invalid -c user.name="Kraft CI" \
            commit -am "chore: stamp plugin manifests for $TAG"
          # actions/checkout persisted GITHUB_TOKEN's own auth header, which
          # takes precedence over any credential embedded in the remote URL --
          # drop it so the push below actually authenticates as the App.
          # Fails with exit 5 when the header was never set (e.g. a checkout
          # config change upstream) -- that's not a reason to abort the stamp.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: stamp plugin manifests for $TAG" \
            --body "Plugin manifest versions, written by the release workflow that just published $TAG." \
            --label release::none
          gh pr merge "$BRANCH" --auto --squash

      - name: bump the homebrew tap
        # Points the formula at this run's own GitHub Release asset, not the
        # PyPI upload -- that one is already sha256-verified above and, unlike
        # querying PyPI's API, needs no wait for index propagation.
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          WHEEL=$(ls dist/*.whl)
          SHA256=$(shasum -a 256 "$WHEEL" | cut -d' ' -f1)
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$WHEEL")"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/itsOmidKarami/homebrew-kraft" /tmp/homebrew-kraft
          cd /tmp/homebrew-kraft
          sed -i \
            -e "s#^  url \".*\"#  url \"$URL\"#" \
            -e "s#^  sha256 \".*\"#  sha256 \"$SHA256\"#" \
            Formula/kraft.rb
          git -c user.email=ci@kraft.invalid -c user.name="Kraft CI" commit -am "kraft ${TAG#v}"
          git push
