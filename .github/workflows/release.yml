# Cut a release by hand: Actions -> release -> Run workflow. Everything merged
# into main since the previous tag goes out together, bumped by the largest
# `release::` label among those pull requests (two minors and three patches is
# a minor), with notes built from each one's `## Changelog` section. Tick
# "dry run" to see the version and notes without releasing anything. Give a
# commit to release an earlier point on main than its tip -- say, while the
# tip's tests are still running.
#
# One job, not a tag-triggered second workflow: a tag pushed with the default
# GITHUB_TOKEN deliberately does not trigger other workflows, and keeping it in
# one job means no stored PAT, the credential you least want in a public repo.
#
# Order matters. The tag is created locally first (setuptools-scm reads the
# version from it, so the wheel cannot be built before it exists), and pushed
# only after the wheel has built and passed its smoke test. A failed build
# therefore leaves no tag behind to clean up.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the version and notes, release nothing"
        type: boolean
        default: false
      sha:
        description: "Commit on main to release (empty: main's tip)"
        type: string
        default: ""

permissions:
  contents: write      # create the tag and the release
  id-token: write      # PyPI trusted publishing
  pull-requests: write # read the merged PRs' labels; open the stamp PR
  actions: read        # check main's test run before releasing from it

jobs:
  release:
    runs-on: ubuntu-latest
    # The button offers every branch; only main releases.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git tag --merged` needs the tags and the history, and a shallow
          # clone has neither -- every release would compute as the first one.
          fetch-depth: 0

      - name: what does this release ship
        id: impact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          WANT: ${{ inputs.sha }}
        run: |
          # Resolved here rather than by actions/checkout's `ref:`, which
          # takes no short SHA. Later steps build whatever HEAD this leaves,
          # but the release tooling is main's: an older commit's copy may
          # predate a fix to it, or not exist at all.
          cp -R dev "$RUNNER_TEMP/dev"
          if [ -n "$WANT" ]; then
            if ! SHA=$(git rev-parse --verify --quiet "$WANT^{commit}"); then
              echo "::error::'$WANT' is not a commit in this repository"
              exit 1
            fi
            git -c advice.detachedHead=false checkout --quiet --detach "$SHA"
          fi
          SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main; only main releases"
            exit 1
          fi
          # PyPI publishes cannot be undone, so the commit being released must
          # have passed its tests on main -- not be still running, not failed.
          TESTS=$(gh run list --workflow test --branch main --event push --commit "$SHA" \
            --json status,conclusion \
            --jq 'if .[0] == null then "missing" elif .[0].status != "completed" then .[0].status else .[0].conclusion end')
          if [ "$TESTS" != "success" ]; then
            echo "::error::test on main at $SHA is '$TESTS', not success; wait for it or fix main"
            exit 1
          fi
          # Every exact `vX.Y.Z` tag reachable from main, highest by version
          # order. A repo can carry more than one malformed rc tag on the very
          # commit rc1 shipped from (a ruleset can block deleting the wrong
          # one), so `git describe` excluding a couple of glob shapes is not
          # enough -- `v1.0.0rc1`, `v1.0.0.rc1` and `v1.0.0-rc.1` all fail the
          # anchored regex and never enter the running.
          PREVIOUS=$(git tag --list --merged "$SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          # A commit behind the newest release would recompute a tag that
          # already exists, or one numbered below it.
          LATEST=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$LATEST" != "$PREVIOUS" ]; then
            echo "::error::$SHA is behind $LATEST, already released; pick a commit after it"
            exit 1
          fi
          RANGE=${PREVIOUS:+$PREVIOUS..}$SHA
          # The pull request behind each commit since the previous tag. A
          # commit with none -- a direct push, the revert button -- carries no
          # declaration and adds nothing to the bump or the notes.
          for c in $(git rev-list --first-parent "$RANGE"); do
            gh api "repos/$GITHUB_REPOSITORY/commits/$c/pulls" \
              --jq '.[0] // empty | {number, title, body, labels: [.labels[].name]}'
          done | jq -s 'unique_by(.number)' > "$RUNNER_TEMP/prs.json"
          # No `|| true`: plan_release exits non-zero on an unlabelled PR or a
          # tag it cannot read, and swallowing that would turn it into a
          # silently skipped release.
          TAG=$(python3 "$RUNNER_TEMP/dev/plan_release.py" plan "$PREVIOUS" "$RUNNER_TEMP/prs.json" "$RUNNER_TEMP/notes.md")
          {
            echo "## ${TAG:-No release} (previous: ${PREVIOUS:-none})"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$TAG" ]; then
            echo "nothing since ${PREVIOUS:-the start} ships; not releasing"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "dry run: would release $TAG"
            TAG=
          else
            echo "releasing $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.impact.outputs.tag != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.impact.outputs.tag != ''
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: put uv-installed tools on PATH
        # `$GITHUB_PATH` only takes effect for later steps, not the one that
        # writes it -- hence its own step ahead of the one that runs `just`.
        # Insurance against the runner image not already putting
        # ~/.local/bin on PATH by default; GitLab's equivalent job did this
        # explicitly rather than relying on it.
        if: steps.impact.outputs.tag != ''
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: tag locally, then build
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
        run: |
          git -c user.email=ci@kraft.invalid -c user.name="Kraft CI" tag -a "$TAG" -m "$TAG"
          uv tool install rust-just
          npm ci --prefix frontend
          just bundle
          uv build --wheel

      - name: smoke test the wheel
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
        run: |
          # A wheel that lost the SPA, or that versioned itself from a shallow
          # clone, must not become a release. This is the guard that makes
          # `just bundle` living outside the build backend survivable.
          WHEEL=$(ls dist/*.whl)
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install "$WHEEL"
          /tmp/smoke/bin/kraft --version | grep -qF "${TAG#v}"
          # Ask the installed package where its bundle is, rather than guessing
          # a site-packages path that a python version bump would invalidate.
          /tmp/smoke/bin/python -c \
            "from kraft.paths import BUNDLED; import sys; sys.exit(0 if (BUNDLED / 'web' / 'index.html').is_file() else 1)"

      - name: push the tag and create the release
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "$TAG"
          gh release create "$TAG" dist/*.whl --title "Kraft $TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: publish to PyPI
        if: steps.impact.outputs.tag != ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: mint a token to open the stamp PR
        # The default GITHUB_TOKEN deliberately can't do this part: GitHub
        # suppresses further workflow runs triggered by GITHUB_TOKEN, so a PR
        # opened with it would never fire test.yml -- its required status
        # checks would sit pending forever and auto-merge below would never
        # fire. A GitHub App installation token doesn't carry that
        # restriction, is scoped to just this repo (contents + pull-requests),
        # and isn't tied to a personal account the way a PAT would be.
        if: steps.impact.outputs.tag != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kraft

      - name: stamp plugin manifests and CHANGELOG.md for this release
        # Writing plugin.json's version and the CHANGELOG.md section here, not
        # on the PRs that make up the release, is the whole point: a value only
        # this job ever writes can never conflict with an in-flight PR, and no
        # PR has to guess what version it will ship in. `main` requires a pull
        # request (see the repo's branch ruleset), so this can't just push --
        # it opens a PR and lets required checks auto-merge it. That PR carries
        # release::none, so it adds nothing to the next release's bump.
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${TAG#v}"
          BRANCH="stamp-plugin-versions-$VERSION"
          # Off main's tip, not the released commit, which may be behind it.
          git checkout --quiet -b "$BRANCH" origin/main
          python3 dev/stamp_plugin_versions.py "$VERSION"
          # After the build, never before: a dirty tree would give the wheel a
          # setuptools-scm dev version and fail the smoke test.
          python3 dev/plan_release.py changelog "$VERSION" "$RUNNER_TEMP/notes.md"
          git -c user.email=ci@kraft.invalid -c user.name="Kraft CI" \
            commit -am "chore: stamp plugin manifests and changelog for $TAG"
          # actions/checkout persisted GITHUB_TOKEN's own auth header, which
          # takes precedence over any credential embedded in the remote URL --
          # drop it so the push below actually authenticates as the App.
          # Fails with exit 5 when the header was never set (e.g. a checkout
          # config change upstream) -- that's not a reason to abort the stamp.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: stamp plugin manifests and changelog for $TAG" \
            --body "Plugin manifest versions and the CHANGELOG.md section, written by the release workflow that just published $TAG." \
            --label release::none
          gh pr merge "$BRANCH" --auto --squash

      - name: bump the homebrew tap
        # Points the formula at this run's own GitHub Release asset, not the
        # PyPI upload -- that one is already sha256-verified above and, unlike
        # querying PyPI's API, needs no wait for index propagation.
        if: steps.impact.outputs.tag != ''
        env:
          TAG: ${{ steps.impact.outputs.tag }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          WHEEL=$(ls dist/*.whl)
          SHA256=$(shasum -a 256 "$WHEEL" | cut -d' ' -f1)
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$WHEEL")"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/itsOmidKarami/homebrew-kraft" /tmp/homebrew-kraft
          cd /tmp/homebrew-kraft
          sed -i \
            -e "s#^  url \".*\"#  url \"$URL\"#" \
            -e "s#^  sha256 \".*\"#  sha256 \"$SHA256\"#" \
            Formula/kraft.rb
          git -c user.email=ci@kraft.invalid -c user.name="Kraft CI" commit -am "kraft ${TAG#v}"
          git push
