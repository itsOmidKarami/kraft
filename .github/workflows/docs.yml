# Builds the docs site with dev/build_docs_site.sh: the latest stable release's
# pages at /kraft/ and main's at /kraft/next/, both with main's site code. Runs
# on every PR that touches it, building both versions, so a change to
# docsite/app that breaks the release's older pages fails the PR, not a merge
# to main after the fact. Publishes to GitHub Pages on push to main and on a
# manual run, which release.yml dispatches after a stable release so /kraft/
# switches to the new tag. Separate from test.yml/release.yml: a docs-only
# change should not wait on the backend/frontend test matrix, and a docs build
# failure should not block a release.
name: docs

on:
  pull_request:
    paths: &docs_paths
      - "docsite/**"
      # docsite/public/assets is a symlink into here; every page's images
      # resolve through it, so a screenshot-only change must still trigger a
      # rebuild.
      - ".github/assets/**"
      - "frontend/public/icon.svg"
      - "dev/build_docs_site.sh"
      - "dev/check_llm_docs.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths: *docs_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The stable build reads the latest release tag's pages, and a
          # shallow clone has no tags.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docsite/package-lock.json

      - name: build both versions
        run: |
          npm ci --prefix docsite
          dev/build_docs_site.sh "$RUNNER_TEMP/site"

      # The copies written for LLMs (raw/*.md, which llms.txt, "Copy page" and
      # "Open in Claude/ChatGPT" serve, and llms-full.txt) are not HTML, so the
      # lychee step below never reads them. Every push too, not only PRs:
      # this one needs no network, and a regression must not reach Pages.
      - name: check the LLM copies of the docs
        run: python3 dev/check_llm_docs.py "$RUNNER_TEMP/site"

      # docsite/content/redirects.yml is the map of moved addresses, which
      # docsite/content.config.ts keeps out of Docus's page collections by
      # reaching into a source's file list. If a Docus upgrade breaks that,
      # the map comes back as a page, listed in the sitemap and llms.txt.
      - name: the map of moved addresses is not a page
        run: |
          ! ls "$RUNNER_TEMP/site/redirects.html" "$RUNNER_TEMP/site/next/redirects.html" 2>/dev/null

      # Every link on main's pages (/kraft/next/), internal and external,
      # anchors included. PRs only: a link that rots between PRs must not
      # block the Pages deploy on push; the next docs PR catches it instead.
      #
      # Two inputs. The built HTML, for internal links and anchors: a page's
      # route is its folder minus the number prefixes, which only the build
      # knows. The Markdown, for external links: Docus marks every content
      # link rel="nofollow", and lychee skips those in HTML. The Markdown's
      # own /... links are left to the HTML (the linkroot exclude below).
      #
      # The pages link to /kraft/..., so --root-dir is a directory whose
      # kraft/ is the built site. A route like /kraft/next/guides/vscode is a
      # directory (holding only _payload.json) beside vscode.html, the file
      # Pages serves for it: --index-files index.html,. with
      # --fallback-extensions html resolves it the same way.
      #
      # Excluded: the site outside /kraft/next/. The "Docs for the release"
      # banner links every page to its release twin, which a page new on main
      # does not have yet (VersionBanner.vue says so). The example domains
      # the docs use (example.com and the like) lychee skips on its own.
      #
      # Remapped to local files instead of fetched: the site's own URLs
      # (canonical, og:url), which the live site lacks for a page this PR
      # adds; and the repo's blob/tree/edit links on main, to this checkout,
      # for the same reason and because github.com rate-limits a runner that
      # fetches dozens of them.
      - name: link root
        if: github.event_name == 'pull_request'
        run: mkdir -p "$RUNNER_TEMP/linkroot" && ln -s "$RUNNER_TEMP/site" "$RUNNER_TEMP/linkroot/kraft"
      - name: check links
        if: github.event_name == 'pull_request'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --include-fragments
            --root-dir ${{ runner.temp }}/linkroot
            --index-files index.html,.
            --fallback-extensions html
            --exclude '^file:///.*/linkroot/'
            --include '^file:///.*/linkroot/kraft/next(/|#|$)'
            --remap 'https://itsomidkarami\.github\.io/kraft/ file://${{ runner.temp }}/linkroot/kraft/'
            --remap 'https://github\.com/itsOmidKarami/kraft/(?:blob|tree|edit)/main/ file://${{ github.workspace }}/'
            '${{ runner.temp }}/linkroot/kraft/next/**/*.html'
            'docsite/content/**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pages setup only makes sense for the thing that's about to deploy --
      # a PR build stops here, checked but not published.
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
