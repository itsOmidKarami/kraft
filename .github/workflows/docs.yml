# Builds docsite/ with Nuxt/Docus on every PR that touches it (a broken
# build fails the PR, not a merge to main after the fact) and publishes to
# GitHub Pages on push to main. Separate from test.yml/release.yml: a
# docs-only change should not wait on the backend/frontend test matrix, and a
# docs build failure should not block a release.
name: docs

on:
  pull_request:
    paths: &docs_paths
      - "docsite/**"
      # docsite/public/assets is a symlink into here; every page's images
      # resolve through it, so a screenshot-only change must still trigger a
      # rebuild.
      - ".github/assets/**"
      - "frontend/public/icon.svg"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths: *docs_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docsite/package-lock.json

      - name: build the site
        run: |
          npm ci
          npx nuxt generate
        working-directory: docsite

      # Pages setup only makes sense for the thing that's about to deploy --
      # a PR build stops here, checked but not published.
      - if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docsite/.output/public

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
