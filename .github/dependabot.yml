version: 2
updates:
  # Dependabot rejects two update configs with the same ecosystem+directory,
  # so this can't split prod/dev bumps into separate labeled blocks. Default
  # to release::patch -- a reviewer downgrades to release::none on the rare
  # dev-only bump, same as any other PR's label is just the author's claim.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels:
      - release::patch

  # A major bump (React, zustand, vite) is a migration, not a weekly PR: it
  # needs someone to port the code, so Dependabot leaves those to a person.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels:
      - release::patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The extension's dependencies ship in the .vsix on the Marketplace.
  # @types/vscode stays at engines.vscode's floor (`vsce package` refuses a
  # newer one), and @types/node at the major VS Code's runtime ships.
  - package-ecosystem: npm
    directory: /vscode
    schedule:
      interval: weekly
    labels:
      - release::patch
    ignore:
      - dependency-name: "@types/vscode"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The docs site is built and deployed by CI, never shipped in a release.
  - package-ecosystem: npm
    directory: /docsite
    schedule:
      interval: weekly
    labels:
      - release::none

  # Keeps the SHA-pinned actions in .github/workflows/*.yml current -- those
  # pins have no other update path. Always CI-only, never shipped.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - release::none
