version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly

  # Keeps the SHA-pinned actions in .github/workflows/*.yml current --
  # those pins have no other update path.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
