name: Bug report
description: Something in Kraft does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. kraft item create "..." --autostart
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kraft version
      description: The output of `kraft --version`.
      placeholder: kraft 1.1.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: kraft admin doctor
      description: The output of `kraft admin doctor`.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.5, Ubuntu 24.04, ...
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Agent harness and its version
      description: The agent CLI that ran the work (claude, codex, gemini, amp, cursor or opencode) and the output of its `--version`.
      placeholder: claude 2.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything relevant from `kraft view logs ID` or `kraft view events ID`. Remove secrets first.
      render: text
