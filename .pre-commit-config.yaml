# Beads owns core.hooksPath (.beads/hooks); `pre-commit install` won't work.
# Run manually with `uv run pre-commit run --all-files`, or via the tail
# appended to .beads/hooks/pre-commit. CI is the hard gate.
exclude: '^(\.beads/|\.claude/|uv\.lock$|docs/)'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
