# Beads owns core.hooksPath (.beads/hooks); `pre-commit install` won't work.
# Run manually with `uv run pre-commit run --all-files`, or via the tail
# appended to .beads/hooks/pre-commit. CI is the hard gate.
exclude: '^(\.beads/|\.claude/|uv\.lock$|docs/)'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the `ruff` floor in pyproject.toml: an older ruff here
    # does not know PEP 758 (py3.14 unparenthesized `except A, B:`) and fails
    # valid source the project formatter just produced.
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # docsite/package-lock.json is ~800KB: Docus/Nuxt UI's dependency
        # tree is much bigger than the frontend's. A real lockfile, not a
        # mistake -- raise the ceiling rather than exclude lockfiles wholesale.
        args: [--maxkb=1000]
  # Kraft-m2wru: local only -- CI has no claude CLI or credential. Scoped to the
  # files that can put a model the CLI refuses into what ships.
  - repo: local
    hooks:
      - id: shipped-models-smoke
        name: shipped models launch on the real CLI
        entry: just smoke-models-hook
        language: system
        pass_filenames: false
        # So the SKIPPED line shows when a worker or a credential-less shell commits.
        verbose: true
        files: ^(templates/|src/kraft/harnesses/)
      # vscode/schemas/ is generated from pydantic models spread across
      # src/kraft/ (templates/models.py, environment.py, policy.py, config.py,
      # cap_levels.py, ...); a hand-kept file list would miss the next one.
      # Regenerates them; pre-commit fails the commit when that changes a file,
      # and re-adding the regenerated files is the fix. CI's gate is
      # tests/test_config_schemas.py.
      - id: config-schemas-current
        name: vscode/schemas match the pydantic models
        entry: just schemas
        language: system
        pass_filenames: false
        files: ^(src/kraft/|vscode/schemas/)
