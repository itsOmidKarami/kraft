# One spelling for each term the docs used two ways.
extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: false
action:
  name: replace
swap:
  '[Rr]erun(s|ning)?(?!-)': re-run$1
  '[Ss]ubagent(s)?': sub-agent$1
  '(?<!the |a |its |their |session.s |Show )[Ll]og in\b': sign in
  '[Ll]ogged in': signed in
  '[Ll]ogging in': signing in
  '(?<![\w.$/-])id(?![\w=:/-])': ID
  '(?<![\w.$/-])ids(?![\w=:/-])': IDs
  '(?<![\w./:-]|: )docker(?![\w./-])': Docker
  markdown: Markdown
  '(?<![\w.$/-])url(s)?(?![\w=:/-])': URL$1
