# Negations only. "it is" and "that is" stay: a contraction cannot end a
# clause ("leave it as it is"), and "that is," introduces a restatement.
extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: true
action:
  name: replace
swap:
  are not: aren't
  cannot: can't
  could not: couldn't
  did not: didn't
  do not: don't
  does not: doesn't
  has not: hasn't
  have not: haven't
  is not: isn't
  should not: shouldn't
  was not: wasn't
  were not: weren't
  will not: won't
  would not: wouldn't
