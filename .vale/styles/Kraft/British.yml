# British spelling: the US forms the docs have used, each with the British form
# to write. A US spelling this list misses goes here when it turns up.
extends: substitution
message: "Use British '%s' instead of '%s'."
level: error
ignorecase: true
action:
  name: replace
swap:
  'color(s|ed|ing|ful)?(?![\w-])': colour$1
  behavior(s|al)?: behaviour$1
  label(ed|ing): labell$1
  cancel(ed|ing): cancell$1
  model(ed|ing): modell$1
  travel(ed|ing): travell$1
  gray(s|ed|ing)?: grey$1
  center(s)?: centre$1
  centered: centred
  catalog(s)?: catalogue$1
  favorite(s)?: favourite$1
  analyz(e|es|ed|ing): analys$1
  (summar|priorit|custom|initial|normal|serial|material|synthes|optim|minim|maxim|author|emphas|real|final|synchron|sanit|categor|special|standard|visual|recogn|organ|memor|apolog|util|stabil|tokeni|parameter)iz(e|es|ed|ing|ation|ations): $1is$2
  misspelled: misspelt
  judgment(s)?: judgement$1
  honor(s|ed|ing|able)?: honour$1
  dial(ed|ing): diall$1
  unlabeled: unlabelled
  uninitialized: uninitialised
  afterward: afterwards
