hooks:
  on.env.prepare:          { kind: builtin,    handler: env_setup }
  on.spec.requested:       { kind: agent,      command: claude, skill: spec, artifact: spec, steering: [never-signal-processes-you-didnt-start] }
  on.plan.requested:       { kind: agent,      command: claude, skill: plan, artifact: plan, steering: [never-signal-processes-you-didnt-start] }
  on.implementation.start: { kind: agent,      command: claude, steering: [never-signal-processes-you-didnt-start] }
  # Design 3a: catch a submodule the agent touched but the item never
  # declared, right after implementation, before verify's green obscures it.
  on.repos.scan:           { kind: builtin,    handler: scan_submodules }
  on.test.run:             { kind: subprocess, command: [uv, run, pytest, -q] }
  # --- placeholder bindings: on.review.mr.run replaced by its plugin effort (see 03_plugin_adapters) ---
  on.chain.review_ready:     { kind: agent, command: claude, skill: chain-review, artifact: chain_review, steering: [never-signal-processes-you-didnt-start] }
  on.review.local.run:       { kind: agent, command: claude, skill: code-review, steering: [never-signal-processes-you-didnt-start] }
  # backend: auto resolves per repo, from the `forge` recorded on its
  # repos.yaml entry (Settings → Repos). A CLI name here pins every repo to one
  # forge, which is wrong for any install with repos on both. Never probed —
  # see adapters/forge.resolve.
  # Rebases onto repo's current HEAD right before open_mr, so an item that
  # ran straight through the chain doesn't open its MR commits behind
  # (Kraft-4bgg). Real from day one -- unlike the two placeholder bindings
  # below it, this is a plain git operation with nothing to fake out.
  on.mr.rebase:              { kind: builtin, handler: mr_rebase }
  on.mr.open:                { kind: forge, handler: open_mr, backend: auto }
  on.ci.poll:                { kind: forge, handler: ci_poll, backend: auto }
  on.review.mr.run:          { kind: builtin, handler: noop }
  on.mr.sync:                { kind: forge, handler: sync_mr, backend: auto }
  on.human_review.requested: { kind: agent, command: claude, skill: review-brief, artifact: review_brief, steering: [never-signal-processes-you-didnt-start] }
  on.merge:                  { kind: forge, handler: merge, backend: auto }
  # mr_checks' on_failure repair pass (Kraft-xh0q layer 3): reads why
  # on.ci.poll went red and, when the reason is a fixable MR-level thing like
  # a missing label, applies the fix via set_mr_labels. Judgment, not a rules
  # table -- see the skill.
  on.mr_checks.repair:       { kind: agent, command: claude, skill: mr-checks-repair, steering: [never-signal-processes-you-didnt-start] }
  # Fix-loop judge (2026-09-12-verify-fix-loop-judge-design): asked before
  # every fix cycle after the first, for any node with a fix_loop, whether
  # that cycle is still worth spending. Dispatched directly by the executor,
  # not from a node's own `tasks` list -- the same way on.implementation.start
  # is -- so it is generic across every fix loop without a template change.
  on.fix_loop.judge:         { kind: agent, command: claude, skill: fix-loop-judge, steering: [never-signal-processes-you-didnt-start] }
