defaults:
  agent: { steering: [never-signal-processes-you-didnt-start] }
hooks:
  on.env.prepare:          { kind: builtin,    handler: env_setup }
  on.spec.requested:       { kind: agent,      harness: claude, skill: spec, artifact: spec }
  on.plan.requested:       { kind: agent,      harness: claude, skill: plan, artifact: plan }
  on.implementation.start: { kind: agent,      harness: claude }
  # Design 3a: catch a submodule the agent touched but the item never
  # declared, right after implementation, before verify's green obscures it.
  on.repos.scan:           { kind: builtin,    handler: scan_submodules }
  on.test.run:             { kind: subprocess, command: [uv, run, pytest, -q] }
  # --- placeholder bindings: on.review.mr.run replaced by its plugin effort (see 03_plugin_adapters) ---
  on.chain.review_ready:     { kind: agent, harness: claude, skill: chain-review, artifact: chain_review }
  on.review.local.run:       { kind: agent, harness: claude, skill: code-review }
  # Registered but in no default chain: `chain_review` adds it to `verify` when a
  # plan touches auth, sessions, tokens, secrets or permission checks. Its own
  # rules already say to do that and to refuse to approximate with another hook
  # when the right one is missing (skills/chain-review/SKILL.md "When to add"),
  # so before this entry existed the only possible outcome for such a plan was a
  # rationale noting the gap and a chain that ran no security review (Kraft-l2cg).
  on.review.security.run:    { kind: agent, harness: claude, skill: security-review }
  # backend: auto resolves per repo, from the `forge` recorded on its
  # repos.yaml entry (Settings → Repos). A CLI name here pins every repo to one
  # forge, which is wrong for any install with repos on both. Never probed —
  # see adapters/forge.resolve.
  # Rebases onto repo's current HEAD right before open_mr, so an item that
  # ran straight through the chain doesn't open its MR commits behind
  # (Kraft-4bgg). Real from day one -- unlike the two placeholder bindings
  # below it, this is a plain git operation with nothing to fake out.
  on.mr.rebase:              { kind: builtin, handler: mr_rebase }
  # Authors the merge request's title, labels, assignees, reviewers and
  # description from the rebased diff and the repo's own conventions, before
  # `on.mr.open` creates it -- labels are load-bearing input to CI (Kraft-xh0q),
  # so they have to exist before the first pipeline, not after.
  on.mr.describe:            { kind: agent, harness: claude, skill: mr-metadata, artifact: mr_meta, model: sonnet, effort: medium }
  on.mr.open:                { kind: forge, handler: open_mr, backend: auto }
  on.ci.poll:                { kind: forge, handler: ci_poll, backend: auto }
  on.review.mr.run:          { kind: builtin, handler: noop }
  on.mr.sync:                { kind: forge, handler: sync_mr, backend: auto }
  on.human_review.requested: { kind: agent, harness: claude, skill: review-brief, artifact: review_brief }
  on.merge:                  { kind: forge, handler: merge, backend: auto }
  # Kraft-43kw: watches the pipeline `on.merge` itself just triggered on the
  # target branch, so a break several near-simultaneous merges expose lands
  # on this item's own tracking bead instead of silently becoming every other
  # item's rebase problem to re-diagnose independently.
  on.merge.watch:            { kind: forge, handler: merge_watch, backend: auto }
  # mr_checks' on_failure repair pass (Kraft-xh0q layer 3): reads why
  # on.ci.poll went red and, when the reason is a fixable MR-level thing like
  # a missing label, applies the fix via set_mr_labels. Judgment, not a rules
  # table -- see the skill.
  on.mr_checks.repair:       { kind: agent, harness: claude, skill: mr-checks-repair }
  # Fix-loop judge (2026-09-12-verify-fix-loop-judge-design): asked before
  # every fix cycle after the first, for any node with a fix_loop, whether
  # that cycle is still worth spending. Dispatched directly by the executor,
  # not from a node's own `tasks` list -- the same way on.implementation.start
  # is -- so it is generic across every fix loop without a template change.
  on.fix_loop.judge:         { kind: agent, harness: claude, skill: fix-loop-judge }
