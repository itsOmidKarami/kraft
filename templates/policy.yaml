# Cap defaults for loop-bounded work. Every number here is a placeholder
# Tune against real runs.
loops:
  verify_fix_loop:   { attempts: 3, wall_clock_s: 3600 }
  ci_fix_loop:       { attempts: 3, wall_clock_s: 3600 }
  # Replaces ci_poll's old poll_timeout (30 minutes, Kraft-ru98): a pipeline
  # that has not settled after this many re-entries or this long, whichever
  # comes first, stops the item for a human instead of waiting forever.
  ci_wait:           { attempts: 60, wall_clock_s: 1800 }
  # Guards against a fast-moving default branch bouncing open_mr <->
  # verify forever: a clean verify pass doesn't spend a fix cycle of its own
  # (Kraft-4bgg), so without this cap nothing else would ever stop it.
  rebase_bounce:     { attempts: 2, wall_clock_s: 3600 }
  # A conflict-resolving agent dispatched by /resume, /retry, or
  # any node whose rebase conflicts (Kraft-s7c04.23). New installs only --
  # templates/ is seeded once and never overwritten, so an existing install falls back to
  # `default:` below with the same numbers; the code does not depend on
  # this key being present.
  rebase_conflict:   { attempts: 3, wall_clock_s: 3600 }
default:             { attempts: 3, wall_clock_s: 3600 }

# Which finding severities burn a fix cycle. Minor findings are recorded and
# shown at the human_review gate instead — a roll-up nobody reads is a silent
# discard, so they are rendered there, not merely stored.
findings:
  loop_severities: [critical, important]

# Spend caps, in dollars, both off by default. A cap refuses to START the next
# agent task; it cannot interrupt one that is already running, because the agent
# CLI only reports its cost when the session exits. Overshoot is bounded by the
# cost of one task, not by the cap.
budget:
  work_item_usd: 10     # per work item, across every loop in its chain
  daily_usd: 50         # every work item on this instance, since local midnight

# How many times Kraft may auto-relaunch a work item after a rejected API rate
# limit before it gives up and stops for a human. Not a fix-loop cap: a rate
# limit wait can run for hours, this only counts attempts.
rate_limit_retries: 5

# Seconds one forge CLI call (gh/glab/git) may run before it is killed and
# reported as a forge error. Bounds a single call, not a pipeline wait (that is
# loops.ci_wait). Raise it on a slow forge. Read at startup.
forge_cli_timeout_s: 120

# Completed/abandoned items older than this get auto-archived (UI v2 · 03).
# The board's Done group header states this number, so keep them in sync.
archive:
  after_days: 30

# Fire a work item from a schedule instead of typing into `kraft item create`
# (Kraft-859) -- always files the item paused, same as manual intake. Off by
# default (no triggers below means no timer, no tick); uncomment and edit to
# add one.
# triggers:
#   - cron: "0 9 * * 1,2,3,4,5"  # 5-field cron, minute resolution; 9am weekdays
#     repo: /path/to/repo
#     chain: default              # a chain_template id from templates/
#     title: "Nightly dependency check"
#     description: "Filed by the 9am weekday trigger"
