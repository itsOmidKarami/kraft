id: default
nodes:
  # Every node that authors or measures code rebases first: a spec written
  # against stale code propagates into the plan and the implementation, where a
  # later rebase does not undo it (Kraft-yd6q4). No-op when already current.
  - id: spec
    steps:
      - [on.mr.rebase]
      - [on.spec.requested]
    gate_after: spec_approval
  - id: plan
    steps:
      - [on.mr.rebase]
      - [on.plan.requested]
    gate_after: plan_approval
  - id: chain_review
    tasks: [on.chain.review_ready]
    gate_after: chain_finalized
    auto_escalate: true
  # Kraft-ilff3: the scan has to read a worktree the agent has actually touched,
  # so it is a second step, not a co-task. It was its own node between here and
  # `verify` until ordered steps existed to say this directly.
  # `on.env.prepare` follows each rebase because a rebase can land a new
  # lockfile and nothing else rebuilds the environment (Kraft-zlsuk).
  - id: implementation
    steps:
      - [on.mr.rebase]
      - [on.env.prepare]
      - [on.implementation.start]
      - [on.repos.scan]
    gate_after: null
  - id: verify
    steps:
      - [on.mr.rebase]
      - [on.env.prepare]
      - [on.test.run, on.review.local.run]
    fix_loop: verify_fix_loop
    gate_after: null
  # Kraft-bk16r: three nodes existed because a node could not hold an order.
  # The rebase must stop the node when it moves the base -- otherwise the merge
  # request is opened against a diff nobody re-verified and only then bounced --
  # which `rebase_bounce_to` on this node now expresses directly. The bounce
  # returns to `verify`, which re-prepares the environment and re-runs the
  # tests over the rebased diff. The metadata is authored from the rebased diff
  # before the MR is created rather than at the human_review gate.
  - id: open_mr
    steps:
      - [on.mr.rebase]
      - [on.mr.describe]
      - [on.mr.open]
    gate_after: null
    rebase_bounce_to: verify
  - id: mr_checks
    steps:
      - [on.ci.poll]
      - [on.review.mr.run]
    gate_after: null
    fix_loop: ci_fix_loop
    rebase_bounce_to: verify
  - id: human_review
    tasks: [on.human_review.requested]
    gate_after: human_review_approval
    # Kraft-ko7j: rejecting the last gate used to stop the item dead. It now
    # re-enters the chain here, with the reviewer's note as the implementer's
    # steer, and walks back up to this same gate over a changed diff.
    reject_to: implementation
  # After the gate, not before it: the gate has to stay on the node that
  # carries the review brief (`_gate_artifact` scans the gate node's own
  # tasks), and pushing after approval means the merged head includes the
  # brief commit and anything the human committed while reviewing.
  - id: mr_sync
    tasks: [on.mr.sync]
    gate_after: null
  - id: merge
    tasks: [on.merge]
    gate_after: null
    # A conflict mr_sync's push (or a rebase since mr_checks last looked)
    # turns up is handled the same way mr_checks handles one: a forced
    # rebase, then straight back to verify to re-run tests over the
    # rebased diff before anything is ever merged (draft-MR workflow spec).
    rebase_bounce_to: verify
  # Kraft-43kw: a plain read-and-react step, not a fix_loop -- nothing here
  # is this item's own defect to iterate on. mark_completed/close_beads now
  # fire after this node, not after `merge`, so the item's tracking bead does
  # not close until the branch it landed on is actually healthy.
  - id: post_merge_watch
    tasks: [on.merge.watch]
    gate_after: null
