id: default
nodes:
  - id: spec
    tasks: [on.spec.requested]
    gate_after: spec_approval
  - id: plan
    tasks: [on.plan.requested]
    gate_after: plan_approval
  - id: chain_review
    tasks: [on.chain.review_ready]
    gate_after: chain_finalized
  - id: env_setup
    tasks: [on.env.prepare]
    gate_after: null
  - id: implementation
    tasks: [on.implementation.start, on.repos.scan]
    gate_after: null
  - id: verify
    tasks: [on.test.run, on.review.local.run]
    fix_loop: verify_fix_loop
    gate_after: null
  - id: open_mr
    tasks: [on.mr.open]
    gate_after: null
  - id: mr_checks
    tasks: [on.ci.poll, on.review.mr.run]
    gate_after: null
    # One repair pass before this node gives up (Kraft-xh0q): read why the
    # pipeline went red and, when it's a fixable MR-level thing like a
    # missing label, fix it and let on.ci.poll re-measure for real rather
    # than trust the repair's own word (Kraft-rv6i's on_failure).
    on_failure: [on.mr_checks.repair]
  - id: human_review
    tasks: [on.human_review.requested]
    gate_after: human_review_approval
    # Kraft-ko7j: rejecting the last gate used to stop the item dead. It now
    # re-enters the chain here, with the reviewer's note as the implementer's
    # steer, and walks back up to this same gate over a changed diff.
    reject_to: implementation
  # After the gate, not before it: the gate has to stay on the node that
  # carries the review brief (`_gate_artifact` scans the gate node's own
  # tasks), and pushing after approval means the merged head includes the
  # brief commit and anything the human committed while reviewing.
  - id: mr_sync
    tasks: [on.mr.sync]
    gate_after: null
  - id: merge
    tasks: [on.merge]
    gate_after: null
