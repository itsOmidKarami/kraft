# The dev instance's ACP agent: fixtures/fake_acp_agent.py, which spends no tokens.
# `just dev` copies this into .dev/config/harnesses/ and adds a `fake-acp` profile.
id: fake-acp
kind: acp
command: [fake-acp-agent]
reports: [tokens, cost]
options:
  model: { config: model }
  effort: { config: effort }
# Every dev-instance task holds a tool policy, and an entry that cannot make the agent ask
# refuses one: the fake agent asks before every call when this switch is set.
asks_everything: { env: { FAKE_ACP_ASK_ALL: "1" } }
tool_names: { execute: Bash, read: Read, edit: Edit }
