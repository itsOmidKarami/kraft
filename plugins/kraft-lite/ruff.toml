# This directory is published as a standalone repo, so this config must stand on
# its own there: no `extend` to a monorepo pyproject.toml that the split leaves
# behind. Values mirror the root config deliberately.
line-length = 100

# The monorepo requires Python >=3.12, but the published plugin must run on
# whatever python3 its host repo has, and .github/workflows/test.yml pins that
# floor at 3.10. Without this, ruff would format and lint kl.py for 3.12 and
# accept syntax (PEP 695 `type` aliases, nested f-string quotes) that the floor
# refuses to parse.
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
