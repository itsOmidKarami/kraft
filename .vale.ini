# Vale checks the docs against the house style: British spelling, contractions,
# and one spelling for each Kraft term. `just vale` runs it; CONTRIBUTING.md's
# "Voice and spelling" has the rules.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Kraft
IgnoredScopes = code, tt

[*.md]
BasedOnStyles = Kraft
# An MDC component's YAML props (`::name` then a `---` block) are not prose.
BlockIgnores = (?s) *::[\w-]+\n *---\n.*?\n *---
# A snake_case word is a config key or an event, named as the code names it.
# "could not decide" is a review outcome, quoted as the app prints it.
TokenIgnores = \b[a-z][a-z0-9]*(?:_[a-z0-9]+)+\b, could not decide

# Pages about Kraft's own GitHub repo, where a pull request is a pull request.
[{CONTRIBUTING,ARCHITECTURE,CLAUDE,AGENTS,RELEASING,SECURITY}.md]
Kraft.MergeRequest = NO

[docs/testing.md]
Kraft.MergeRequest = NO

[docsite/content/6.project/{6.source-map,7.contributing}.md]
Kraft.MergeRequest = NO
