[project]
name = "kraft"
version = "0.0.0"
description = "Kraft orchestrator walking skeleton"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6",
    "psutil>=5",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "websockets>=15",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "pre-commit>=4",
    "httpx>=0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests needing a real claude binary (Chunk C)",
    "slow: excluded from the blocking PR gate; run in the parallel slow-tests CI job (subprocess servers, real uvicorn, multi-second sleeps)",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
