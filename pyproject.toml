[project]
name = "kraft"
dynamic = ["version"]
description = "A local orchestrator for semi-autonomous agentic SDLC"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Omid Karami", email = "itsomidkarami@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6",
    "psutil>=5",
    "argcomplete>=3",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "websockets>=15",
    "sqlite-vec>=0.1.9",
    # client.py imports these at runtime, not just under test. httpx was a dev
    # dependency until the agent surface existed; a `kraft mcp` installed from a
    # wheel has no dev group to fall back on.
    "httpx>=0.28.1",
    # mcp 2.x: FastMCP was renamed MCPServer and list_tools() became sync, so
    # this is a floor on the API kraft/mcp.py actually uses, not just on bugfixes.
    "mcp>=2",
]

[project.optional-dependencies]
# Semantic search (Effort 4C). Optional: without it FTS still works, hybrid
# degrades to fts, and mode=vector 422s. Keeps a ~130MB model download opt-in.
vector = ["fastembed>=0.8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.6",  # PEP 758 aware; keep .pre-commit-config.yaml rev in step
    "pre-commit>=4",
    "pytest-testmon>=2.2.0",
]

[project.scripts]
kraft = "kraft.cli:main"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

# The version is the git tag, so a release cannot ship a number nobody bumped.
# An untagged checkout builds `0.1.dev4+g1a2b3c`: the last release, the distance
# from it, and the commit -- which is what a bug report actually wants.
[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]

# Built SPA and default config, copied in by `just install`. Absent from a plain
# checkout, so a build that skips that recipe ships an API with no UI.
[tool.setuptools.package-data]
kraft = ["_bundled/**/*", "skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins/kraft-lite/tests"]
markers = [
    "e2e: end-to-end tests needing a real claude binary (Chunk C)",
    "slow: subprocess servers, real uvicorn, multi-second sleeps -- included in the main CI test job, just kept separable for local runs",
    "real_executor: opts a test out of a suite-level executor stub; it drives the real executor and real subprocesses",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[project.urls]
Homepage = "https://github.com/itsOmidKarami/kraft"
Source = "https://github.com/itsOmidKarami/kraft"
Issues = "https://github.com/itsOmidKarami/kraft/issues"
