[project]
name = "kraft-sdlc"
dynamic = ["version"]
description = "A local orchestrator for semi-autonomous agentic SDLC"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Omid Karami", email = "itsomidkarami@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6",
    # Config is modelled in pydantic and every entry point loads config --
    # `kraft mcp` and the CLI must not reach it through a web framework's
    # transitive dependency.
    "pydantic>=2.9",
    "psutil>=5",
    "argcomplete>=3",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "websockets>=15",
    "sqlite-vec>=0.1.9",
    # client.py imports these at runtime, not just under test. httpx was a dev
    # dependency until the agent surface existed; a `kraft mcp` installed from a
    # wheel has no dev group to fall back on.
    "httpx>=0.28.1",
    # mcp 2.x: FastMCP was renamed MCPServer and list_tools() became sync, so
    # this is a floor on the API kraft/mcp.py actually uses, not just on bugfixes.
    "mcp>=2",
]

[project.optional-dependencies]
# Semantic search (Effort 4C). Optional: without it FTS still works, hybrid
# degrades to fts, and mode=vector 422s. Keeps a ~130MB model download opt-in.
vector = ["fastembed>=0.8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.6",  # PEP 758 aware; keep .pre-commit-config.yaml rev in step
    "pre-commit>=4",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.6",
    "pytest-cov>=6",
    # Test tooling, not a product dependency: without it a hung test produces a
    # progress bar, orphan pids and no test name. That cost two CI runs and an
    # hour of counting progress characters to find one nested test run.
    "pytest-timeout>=2.3",
]
docs = ["mkdocs-material>=9"]

[project.scripts]
kraft = "kraft.cli:main"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

# The version is the git tag, so a release cannot ship a number nobody bumped.
# An untagged checkout builds `0.1.dev4+g1a2b3c`: the last release, the distance
# from it, and the commit -- which is what a bug report actually wants.
[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]

# Built SPA and default config, copied in by `just install`. Absent from a plain
# checkout, so a build that skips that recipe ships an API with no UI.
[tool.setuptools.package-data]
kraft = ["_bundled/**/*", "skills/**/*", "harnesses/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins/kraft-lite/tests"]
# A per-test ceiling, so a hang fails with a name and a traceback instead of
# stalling the job. Generous on purpose -- the slowest honest tests here drive a
# real uvicorn or a real `bd` -- so anything that trips this is wedged, not slow.
# `thread` method, not `signal`: most of this suite runs inside `asyncio.run`,
# and a SIGALRM raised into an event loop is swallowed by whatever `await` is
# current. A thread-based timeout dumps every stack and kills the process.
timeout = 120
timeout_method = "thread"
markers = [
    "e2e(*clis): uses a real external CLI (bd, claude, ...) to check a contract; skips unless each named CLI is on PATH (claude also needs KRAFT_E2E=1)",
    "beads_adapter: tests of kraft.adapters.beads itself; keeps the real adapter, with bd stubbed, instead of the suite's in-memory fake",
    "slow: subprocess servers, real uvicorn, multi-second sleeps -- included in the main CI test job, just kept separable for local runs",
    "real_executor: opts a test out of a suite-level executor stub; it drives the real executor and real subprocesses",
]

# relative_files: python-coverage-comment-action diffs coverage against the
# data branch's stored paths, which only line up if both sides are relative.
[tool.coverage.run]
relative_files = true

[tool.ruff]
line-length = 100
extend-exclude = ["docs", "docsite"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[project.urls]
Homepage = "https://itsomidkarami.github.io/kraft/"
Documentation = "https://itsomidkarami.github.io/kraft/"
Source = "https://github.com/itsOmidKarami/kraft"
Issues = "https://github.com/itsOmidKarami/kraft/issues"
