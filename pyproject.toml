[project]
name = "kraft"
version = "0.0.0"
description = "Kraft orchestrator walking skeleton"
requires-python = ">=3.14"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pre-commit>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end tests needing a real claude binary (Chunk C)"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
